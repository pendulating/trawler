; Vale prose linter — configuration for the COLM 2026 manuscript.
;
; Vale has no native LaTeX parser: left alone it lints \label{} keys, math,
; and comments as if they were prose. The [formats] mapping below parses .tex
; as Markdown, which is what unlocks BlockIgnores/TokenIgnores (those are only
; available for markup formats), and the ignore patterns strip the LaTeX.
;
; Run via `scripts/lint_prose.sh` (wires the .venv binary + the right paths).
; Vale's regex engine is Go RE2: no backreferences, no lookahead/lookbehind.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = proselint, write-good

Vocab = NormSim

[formats]
tex = md

; ---------------------------------------------------------------------------
; The manuscript. tables/ and figures/ are excluded by the runner script --
; they are tabular data and TikZ, not prose.
; ---------------------------------------------------------------------------
[*.tex]
BasedOnStyles = Vale, proselint, write-good, NormSim

; --- Rules switched off, with reasons -------------------------------------
; E-Prime bans every form of "to be". That is a fringe style experiment, not
; an academic-writing norm; it fired 150 times and none were actionable.
write-good.E-Prime = NO
; TooWordy flags "however", "therefore", "evaluate", "methodology". The house
; guide (academic-writing-mini.md) *prescribes* "However," and "Therefore," as
; transitions, so this rule actively fights the target style.
write-good.TooWordy = NO
; Typography reads the "(c)" of an enumerated list as a copyright symbol.
; Every hit in the appendices was that false positive.
proselint.Typography = NO

; Math and code environments: no prose inside. figure/table are deliberately
; NOT ignored, because their \caption{} text is prose we want linted.
BlockIgnores = (?s) *\\begin{equation\*?}.*?\\end{equation\*?}, (?s) *\\begin{align\*?}.*?\\end{align\*?}, (?s) *\\begin{gather\*?}.*?\\end{gather\*?}, (?s) *\\begin{multline\*?}.*?\\end{multline\*?}, (?s) *\\begin{eqnarray\*?}.*?\\end{eqnarray\*?}, (?s) *\\begin{verbatim}.*?\\end{verbatim}, (?s) *\\begin{lstlisting}.*?\\end{lstlisting}, (?s) *\\begin{minted}.*?\\end{minted}, (?s) *\\begin{tikzpicture}.*?\\end{tikzpicture}, (?s) *\\begin{tabular\*?}.*?\\end{tabular\*?}, (?s) *\\begin{tabularx}.*?\\end{tabularx}, (?s) *\\begin{algorithm\*?}.*?\\end{algorithm\*?}, (?s) *\\begin{algorithmic}.*?\\end{algorithmic}, (?s) *\\begin{thebibliography}.*?\\end{thebibliography}, (?s)\\\[.*?\\\], (?s)\$\$.*?\$\$

; ORDER MATTERS: these are applied in sequence, so the argument-consuming
; commands must come before the catch-all bare-command pattern at the end.
; Otherwise the catch-all eats `\label` and leaves `{sec:foo}` exposed as prose.
; Group A -- preamble/definition commands, whose arguments nest one level
; (`\newcommand{\fix}{\marginpar{FIX}}`). RE2 has no recursion, so the nesting
; is spelled out explicitly for a single level, which covers every case here.
; Without this, macro bodies leak into the prose stream as bare words.
; Group B -- reference/citation/code commands with flat arguments. \caption is
; deliberately absent: caption text is prose and should be linted.
; Group C -- inline math, then the bare-command catch-all LAST.
;
; LaTeX comments are NOT handled here. They are stripped upstream by
; scripts/prose_lint.py, which is the supported entry point. Two attempts to do
; it in this file both failed: a plain `%.*` matches across newlines here, so a
; single "50\%" silently swallowed the rest of the file, and RE2 has no
; lookbehind to tell an escaped `\%` from a real comment. Anchoring with (?m)^
; then behaved inconsistently inside Markdown block parsing and, worst of all,
; caused Vale to DROP genuine alerts further down the same file. If you run the
; `vale` binary directly, comments will be linted; use scripts/lint_prose.sh.
TokenIgnores = \\(?:newcommand|renewcommand|providecommand|definecolor|DeclareMathOperator|declaretheorem|setlength|addtolength|hypersetup|usepackage|documentclass|graphicspath|newtheorem)\*?\s*(?:\[[^\]]*\])*\s*(?:\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\})+, \\(?:cite[a-zA-Z]*|ref|autoref|Cref|cref|eqref|pageref|nameref|label|input|include|includegraphics|bibliographystyle|bibliography|def|url|href|texttt|verb|lstinline|textcolor|colorbox|vspace|hspace|selectfont|fontsize)\*?\s*(?:\[[^\]]*\])*\s*(?:\{[^{}]*\})+, \$[^$\n]+\$(?:st|nd|rd|th)?, \\[a-zA-Z@]+\*?
