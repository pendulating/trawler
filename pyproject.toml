[project.optional-dependencies]
# Manuscript prose linting (scripts/tex_grammar.py). Both imports are guarded:
# without these installed, the grammar and the spelling pass each report a skip
# instead of failing. See also .vale.ini and scripts/lint_prose.sh.
prose = [
  "language-tool-python",
  "codespell",
]
# One-off data producers. No pipeline needs them; each writes a tracked file
# one time. scripts/fetch_novel_summaries.py imports wikipediaapi at module
# level, so that script alone needs this group.
data-tools = [
  "wikipedia-api",
]
# Prompt-development spikes under prompt_dev/. Not part of any reported result.
spikes = [
  "plurals",
]

[tool.setuptools.packages.find]
include = ["dagspaces*"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://pypi.nvidia.com"]

[tool.ruff.lint]
# Finding 5 (wiki/jul19_refactoring.md): prevent new silent exception swallowing.
# BLE001 = blind except Exception; S110 = except Exception: pass (try-except-pass).
# These are advisory (not auto-fixable) — existing violations are grandfathered
# until the full audit is complete; new code must not add them.
select = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# Serialization cascades and null-object loggers legitimately swallow exceptions.
"dagspaces/common/orchestrator.py" = ["BLE001", "S110"]
"dagspaces/common/vllm_inference.py" = ["BLE001", "S110"]
"tests/**" = ["BLE001", "S110"]
