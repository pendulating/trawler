[project.optional-dependencies]
# Manuscript prose linting (scripts/tex_grammar.py). Both imports are guarded:
# without these installed, the grammar and the spelling pass each report a skip
# instead of failing. See also .vale.ini and scripts/lint_prose.sh.
prose = [
  "language-tool-python",
  "codespell",
]
# One-off data producers. No pipeline needs them; each writes a tracked file
# one time. scripts/fetch_novel_summaries.py imports wikipediaapi at module
# level, so that script alone needs this group.
data-tools = [
  "wikipedia-api",
]
# Prompt-development spikes under prompt_dev/. Not part of any reported result.
spikes = [
  "plurals",
]
# Linting. [tool.ruff.lint] below configures ruff, so declare it: the config
# was present from 2026-07 but the tool never was, which is one reason the
# BLE001/S110 baseline drifted to 488 violations unnoticed.
dev = [
  "ruff",
]

[tool.setuptools.packages.find]
include = ["dagspaces*"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://pypi.nvidia.com"]

[tool.ruff.lint]
# Finding 5 (wiki/jul19_refactoring.md): stop NEW silent exception swallowing.
# BLE001 = blind `except Exception`; S110 = `except Exception: pass`.
select = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# THIS BLOCK IS A DEBT LEDGER, NOT AN APPROVAL.
#
# Before 2026-08-12 these rules were selected but only three files were
# ignored, so `ruff check` exited non-zero on 488 violations across 78 files.
# A rule whose baseline is red enforces nothing: you cannot tell a new
# violation from an old one, so the stated policy — "new code must not add
# them" — could not be applied to anything.
#
# Every file that carried a violation on 2026-08-12 is listed below, so the
# baseline is green and the rules act as a RATCHET: a new violation, in a new
# file or in any file that leaves this list, fails the check.
#
# To pay the debt down: fix a file's handlers, delete its line, keep the check
# green. Do not add a line to silence new code.
#
# AUDIT STATE (2026-08-12). Three passes have run, all over the SILENT
# handlers — `except Exception: pass` / `: continue`. A handler that catches
# broadly and then logs is a weaker signal and was not chased.
#
#   Pass 1 — dagspaces/common/, all 67 silent sites. Five hid real failures
#            and now report. See tests/common/test_silent_failure_audit.py.
#   Pass 2 — every silent site on a RESULT-BEARING path outside common/:
#            the stages, the promotion gates, the inference modules, the
#            judge infrastructure and the orchestrators. Four more fixed,
#            plus the reasoning-budget defect (see
#            tests/common/test_reasoning_budget_callers.py).
#   Pass 3 — the remaining 14, in scripts/ (9), prompt_dev/ (4) and
#            notebooks/ (1). All 14 are malformed-input tolerance in
#            inspectors and one-off scripts: a json.loads inside a loop that
#            skips a bad line, or best-effort config scraping. None sits on a
#            pipeline path. Two prompt_dev steps dropped Pydantic-invalid
#            records silently — their guards fired only on TOTAL loss, so a
#            partial drop went unmentioned — and now count what they drop.
#
# EVERY silent handler in the repository has been read. The ones that remain
# guard best-effort telemetry (SLURM env vars, GPU probes, disk usage),
# process teardown (proc.kill, run.finish, signal handlers), or a parse that
# has an explicit fallback immediately below. For those a silent skip is
# correct and a crash would be wrong.
#
# An entry below is grandfathered, not blessed: it means the file still has
# BLE001/S110 hits, most of which are the legitimate kind.
#
# Tests keep a blanket ignore: a test that asserts on a failure path
# legitimately catches broadly.
"tests/**" = ["BLE001", "S110"]

