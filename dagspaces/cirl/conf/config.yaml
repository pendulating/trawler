defaults:
  - _self_
  - pipeline: cirl_eval
  - prompt: action
  - data: cirl

experiment:
  name: cirl

runtime:
  output_root: null
  debug: false
  sample_n: null
  job_memory_gb: 64

sampling_params:
  seed: 42
  # CIRL-729 is a free-form generation task: the model writes the message
  # (reasoning in <think>, answer in <answer>). The paper samples at temp 0.6;
  # we use greedy (temp 0.0) for reproducible eval, generous max_tokens.
  temperature: 0.0
  max_tokens: 2048

# Per-benchmark sanity calibration. The "prediction" label for this generation
# task is just strict-format-parseable vs not, so the class distribution is
# legitimately skewed — lower the class-balance warn threshold.
sanity:
  thresholds:
    class_balance_min:lt: 0.005

wandb:
  enabled: true
  project: cirl-729
  entity: ""
  group: ""
  table_sample_rows: 1000
  single_run: true

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
