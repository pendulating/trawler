defaults:
  - _self_
  - pipeline: simpleqa_verified_eval
  - data: simpleqa_verified
  - judge: default
  - model: qwen3.5-9b/base

experiment:
  name: simpleqa_verified

runtime:
  output_root: null
  debug: false
  sample_n: null
  job_memory_gb: 64

# SimpleQA expects short factual answers. Keep max_tokens modest by
# default; stages/llm_inference.py auto-bumps to 4096 when the model
# strips <think> blocks (Qwen3 enable_thinking=false etc.).
sampling_params:
  seed: 42
  temperature: 0.0
  max_tokens: 256

wandb:
  enabled: true
  project: simpleqa-verified
  entity: ""
  group: ""
  table_sample_rows: 1000
  single_run: true

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
