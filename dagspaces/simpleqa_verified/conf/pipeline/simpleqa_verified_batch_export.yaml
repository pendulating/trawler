# @package _global_
#
# OpenAI Batch API export variant. Same shape as simpleqa_verified_async
# but emits requests.jsonl tagged with judge.batch.target_model so the
# operator can submit the JSONL via
# `python -m dagspaces.common.batch_api submit <requests.jsonl>`.
#
# Use within eval_all via all_benchmarks_batch_export.yaml's
# judge_batch_extras list (which appends judge.mode=batch_export to
# every judged child).
defaults:
  - override /hydra/launcher: slurm_monitor

judge:
  mode: batch_export

wandb:
  phase: export

pipeline:
  output_root: ${hydra:runtime.output_dir}/simpleqa_verified
  allow_partial: false
  sources: {}
  graph:
    nodes:
      load_dataset:
        stage: load_dataset
        depends_on: []
        inputs: {}
        outputs:
          dataset: outputs/load_dataset/dataset.parquet

      llm_inference:
        stage: llm_inference
        depends_on: [load_dataset]
        inputs:
          dataset: load_dataset.dataset
        outputs:
          dataset: outputs/llm_inference/dataset.parquet
        launcher: slurm_gpu_1x

      judge_grade:
        stage: judge_grade_batch_export
        depends_on: [llm_inference]
        inputs:
          dataset: llm_inference.dataset
        outputs:
          dataset: outputs/judge_grade/pending.parquet
