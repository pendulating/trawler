# @package _global_
# VLM-GeoPrivacy SFT baseline = the GRPO step-0 model (v9/v8 base).
# Uses the v9 run's _merged_sft (raw Qwen3.5-9B + sft-contentless-v6 LoRA merged
# in; vision encoder intact, model_type qwen3_5_vision) with NO GRPO adapter, so
# it is exactly the SFT checkpoint v9 trains on top of — the fair baseline for
# v9-ckpt100 on the judge-free MCQ benchmark. VLM engine/mm config mirrors
# dagspaces/vlm_geoprivacy_bench/conf/model/qwen3.5-9b/{base,sft-ci}.yaml.
model:
  model_source: /share/pierson/matt/UAIR/multirun/2026-06-23_grpo_redesign_full_v9/20-09-18/0/grpo_only_online_external/outputs/grpo/checkpoint/_merged_sft
  model_family: qwen3.5
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    max_model_len: 4096
    max_num_seqs: 5
    enforce_eager: true
  vlm_kwargs:
    mm_processor_kwargs:
      min_pixels: 784
      max_pixels: 1003520
    limit_mm_per_prompt:
      image: 1
