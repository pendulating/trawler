# @package _global_
# VLM-GeoPrivacy eval of v9 GRPO checkpoint-100 (epoch ~0.58) on the judge-free
# MCQ benchmark. Base = the v9 run's _merged_sft (vision encoder intact,
# model_type qwen3_5_vision) + the checkpoint-100 GRPO LoRA (text layers only;
# this exact base+adapter pair already loaded cleanly in the GoldCoin eval).
# Paired with qwen3.5-9b/sft-contentless-v6 (same base, no adapter) to isolate
# whether v9's CI fine-tuning transfers to / harms visual-geoprivacy CI choices.
# VLM engine/mm config mirrors the dagspace base/sft-ci configs.
model:
  model_source: /share/pierson/matt/UAIR/multirun/2026-06-23_grpo_redesign_full_v9/20-09-18/0/grpo_only_online_external/outputs/grpo/checkpoint/_merged_sft
  model_family: qwen3.5
  lora_path: /share/pierson/matt/UAIR/multirun/2026-06-23_grpo_redesign_full_v9/20-09-18/0/grpo_only_online_external/outputs/grpo/checkpoint/checkpoint-100
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    max_model_len: 4096
    max_num_seqs: 5
    enforce_eager: true
    enable_lora: true
    max_lora_rank: 64
  vlm_kwargs:
    mm_processor_kwargs:
      min_pixels: 784
      max_pixels: 1003520
    limit_mm_per_prompt:
      image: 1
