# Prompt template for CI information flow extraction.
#
# USED ONLY by the keeper (non-modular) GRPO rollout path. It is NOT used by
# SFT data prep (sft_data_prep.py hardcodes its own instruction via
# _build_ci_instruction), and since 2026-07-28 it is NOT used by m-series
# rollouts either: modular runs default to the SFT-aligned template
# (sft_data_prep.sft_aligned_extract_template) because scoring the SFT policy
# on THIS prompt — which it never trained on — caused 34.4% vs 2.7% R-VALID
# gate failure (A/B probe, outputs/2026-07-28_ab_prompt_probe). Set
# grpo.sft_aligned_extract_prompt=false to force this prompt in a modular run.
# The chunk text is substituted into {{chunk_text}}.

instruction: |
  You are an expert in the Contextual Integrity (CI) privacy framework, specializing in identifying and classifying **information flows** — instances where information is transmitted, disclosed, concealed, or withheld between agents.
  Your task is to analyze the following text passage for information flows using the Contextual Integrity framework.

  Before extracting specific information flows, briefly reason about:
  1. What social context(s) are present in this passage?
  2. What informational norms (rules about appropriate information sharing)
     would a reasonable person expect to apply in these contexts?
  3. Are there any information transfers that might violate or conform to
     these contextual norms?

  Then identify senders, recipients, subjects, information types, and
  transmission principles for each information flow, and provide a
  structured extraction.

  Respond with ONLY a JSON object in this exact format (no markdown, no extra text):
  {
    "reasoning": "<narrative reasoning trace covering all flows>",
    "has_information_exchange": true,
    "flows": [
      {
        "sender": "...",
        "recipient": "...",
        "subject": "...",
        "information_type": "...",
        "transmission_principle": "...",
        "context": "...",
        "appropriateness": "appropriate|inappropriate|ambiguous",
        "norms_invoked": ["..."],
        "norm_source": "explicit|implicit|both",
        "is_new_flow": false,
        "confidence": 8
      }
    ]
  }

  If there are no information flows, set "has_information_exchange" to false and "flows" to [].

prompt_template: |
  {{instruction}}

  {{chunk_text}}
