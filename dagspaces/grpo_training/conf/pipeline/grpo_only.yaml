# @package _global_
# GRPO-only pipeline with online R_ground.
# Assumes SFT checkpoint and norm universes exist.
# Pre-computed embeddings are optional — NormRetriever re-embeds via the
# embedding server at init when they are not provided.
#
# Usage:
#   NORM_UNIVERSES_PATH=... CI_REASONING_PATH=... \
#   python -m dagspaces.grpo_training.cli \
#     pipeline=grpo_only \
#     training/grpo=online_rground_4gpu \
#     model=qwen3.5-9b/sft-ci

defaults:
  - override /hydra/launcher: slurm_monitor

pipeline:
  output_root: ${hydra:runtime.output_dir}/grpo_only

  sources:
    sft_checkpoint:
      path: ${model.lora_path}
      type: dir
    norm_universes:
      path: ${oc.env:NORM_UNIVERSES_PATH}
      type: json
    ci_reasoning:
      path: ${oc.env:CI_REASONING_PATH}
      type: parquet

  graph:
    nodes:
      grpo_training:
        stage: grpo_training
        depends_on: []
        inputs:
          sft_checkpoint: sft_checkpoint
          chunks: ci_reasoning
          norm_universes: norm_universes
        outputs:
          checkpoint:
            path: outputs/grpo/checkpoint
            type: dir
        launcher: slurm_gpu_4x
        wandb_suffix: grpo_training
