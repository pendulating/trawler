defaults:
  - _self_
  - pipeline: full_training
  - model: qwen3-8b/base
  - training/sft: default
  - training/grpo: colocate_1gpu_prod
  - prompt@prompt_reward_judge: reward_judge
  - prompt@prompt_reward_judge_ranking: reward_judge_ranking
  - prompt@prompt_no_flow_judge: no_flow_judge
  - prompt@prompt_norm_judgment: norm_judgment
  - prompt@prompt_ci_extraction: ci_extraction

experiment:
  name: grpo_training

runtime:
  output_root: outputs/grpo_training
  debug: false
  sample_n: null
  book_id: null
  job_memory_gb: 64

# Embedding model for norm universe / online R_ground
embedding_model:
  model_source: ${oc.env:EMBEDDING_MODEL_PATH,/share/pierson/matt/zoo/models/Qwen3-Embedding-8B}

# Judge model for R_ground reward prep.
# model_source doubles as the `model` field in OpenAI-style API calls to
# the external judge server (klara:8002), so it MUST match the served name.
# Gemma-4-31B-it is the canonical judge as of the 2026-07-23 revision
# (wiki/normative-simulacra.md) and matches scripts/judge_server.sub's own
# default, so a fresh launch now agrees out of the box. Until 2026-08-12 this
# defaulted to the keeper-era Qwen3.6-27B while judge_server.sub served
# Gemma-4-31B-it, so any launch that did not override one of the two failed on
# a served-name mismatch. Do not reuse Qwen3.6-27B for new runs. See
# wiki/changelog/2026-07-20_grpo_methodology_congruency_review.md §3.1.
judge_model:
  model_source: ${oc.env:JUDGE_MODEL_PATH,/share/pierson/matt/zoo/models/Gemma-4-31B-it}
  engine_kwargs:
    tensor_parallel_size: 2
    max_model_len: 16384
    max_num_batched_tokens: 16384
    max_num_seqs: 64
    kv_cache_dtype: fp8
    enforce_eager: false
    enable_chunked_prefill: true
    enable_prefix_caching: true

wandb:
  enabled: true
  project: grpo-ci-training

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
