# @package _global_
# COLM paper sweep — λ axis (contrastive_lambda) at ρ=0.
#
# 7 cells: λ ∈ {0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0} with contrastive_ratio=0.
# Origin (λ=1.0, ρ=0) doubles as the "primary" config used in main-table results.
#
# Used together with sweep/ratio_axis.yaml and sweep/offaxis.yaml to build the
# 15-cell (λ × ρ) sweep described in §A.4 / app:grpo-ablation-viz. The launcher
# `scripts/launch_lambda_ratio_sweep.sh` runs all three sequentially.
#
# Prerequisites — export before launch:
#   EMBEDDING_SERVER_URL   (e.g. http://klara:8001 — Qwen3-Embedding-8B)
#   JUDGE_SERVER_URL       (e.g. http://klara:8002 — Qwen3.6-27B)
#   SFT_CHECKPOINT_PATH    (the SFT LoRA dir feeding into GRPO)
#   NORM_UNIVERSES_PATH    (norm_universes.json from norm_universe stage)
#   CI_REASONING_PATH      (chunks parquet with chunk_text + source_id)
#   NORM_EMBEDDINGS_PATH   (optional — per-book .npy embeddings)
#
# Usage:
#   python -m dagspaces.grpo_training.cli +sweep=lambda_axis
#
# After training, each cell writes its checkpoint to:
#   multirun/<date>_lambda_axis_sweep/<time>/lambda=<value>/grpo_only_online_external/outputs/grpo/checkpoint
# Generate eval-time model yamls with scripts/build_sweep_model_yamls.py
# (created by the launcher script).

defaults:
  - override /pipeline: grpo_only_online_external
  - override /model: qwen3.5-9b/sft-ci
  - override /training/grpo: online_rground_external

experiment:
  name: lambda_axis_sweep

# Pin contrastive_ratio=0 so this is a pure λ axis at the canonical ρ=0 setting.
training:
  grpo:
    contrastive_ratio: 0.0

hydra:
  mode: MULTIRUN
  launcher:
    # 3 concurrent GRPO trainings. Each consumes one slurm_train_1x job and
    # shares the external embedding+judge servers. Increase if cluster quota
    # allows and judge throughput sustains.
    array_parallelism: 3
  sweep:
    subdir: lambda=${training.grpo.contrastive_lambda}
  sweeper:
    params:
      training.grpo.contrastive_lambda: 0.0,0.25,0.5,0.75,1.0,1.5,2.0
