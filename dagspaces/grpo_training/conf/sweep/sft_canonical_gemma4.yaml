# @package _global_
# Hydra sweep: SFT the canonical model set on the Gemma-4-teacher fiction10 flows.
#
# Recipe = contentless-v6 (the keeper's SFT recipe): sft/default.yaml as-is
# (all flow_* on, lr 2e-5, 3 epochs, LoRA r64/a128) PLUS
# training.sft.negative_selection=contentless. Matches the invocation that
# produced qwen3.5-9b/sft-contentless-v6 (multirun/2026-06-19_sft_contentless_v6/).
#
# Training data = the 2026-07-12 Gemma-4-31B-teacher fiction10 flows, wired
# EXPLICITLY below (not via CI_*_PATH env) so each job's .hydra records the exact
# corpus — no silent env fallback.
#   reasoning : 2993 rows   ci_flows : 16200 rows
#
# Models (10 × 1-GPU cells). gpt-oss-20b is NOT here — it needs FSDP on 2 GPUs
# and the gpt_oss recipe; launch it via sweep=sft_canonical_gemma4_gptoss.
# CIRL + ContextReasoner are comparison baselines, not SFT targets.
#
#   job 0  qwen3.5-2b/instruct        job 5  gemma-4-12b/instruct
#   job 1  qwen3.5-4b/instruct        job 6  openthinker3-7b/instruct
#   job 2  qwen3.5-9b/instruct        job 7  llama3.1-8b/instruct
#   job 3  gemma-4-e2b/instruct       job 8  harc-llama3.1-8b/instruct
#   job 4  gemma-4-e4b/instruct       job 9  phi-4/instruct
#
# Each cell submits one orchestrator (slurm_monitor) that fans out to
# sft_data_prep (slurm_cpu) + sft_training (slurm_gpu_1x). Output layout:
#   multirun/<date>_sft_canonical_gemma4/<time>/<job>/sft_only/outputs/sft/checkpoint
#
# Usage:
#   python -m dagspaces.grpo_training.cli --multirun +sweep=sft_canonical_gemma4
#
# Note: transformers 5.6.2 in .venv — verify the three gemma-4 cells load
# (Gemma4/Gemma4Unified arch) before trusting them; they are the likeliest to
# fail at model-load. Qwen3.5 loads via trust_remote_code.

defaults:
  - override /pipeline: sft_only
  - override /model: qwen3.5-9b/instruct   # placeholder; swept below

experiment:
  name: sft_canonical_gemma4

training:
  sft:
    negative_selection: contentless

pipeline:
  sources:
    ci_reasoning:
      path: /share/pierson/matt/UAIR/outputs/2026-07-12_fiction10_flows_gemma4/23-14-17/COLM_flows_fiction_gemma4/outputs/ci_reasoning/reasoning.parquet
    ci_extraction:
      path: /share/pierson/matt/UAIR/outputs/2026-07-12_fiction10_flows_gemma4/23-14-17/COLM_flows_fiction_gemma4/outputs/ci_extraction/ci_flows.parquet

hydra:
  mode: MULTIRUN
  launcher:
    # Concurrent SFT monitor/GPU cells. 5 = two waves over the 10 models;
    # leaves headroom on the 8×A6000 box for the judge server / other users.
    array_parallelism: 5
  sweeper:
    params:
      model: qwen3.5-2b/instruct,qwen3.5-4b/instruct,qwen3.5-9b/instruct,gemma-4-e2b/instruct,gemma-4-e4b/instruct,gemma-4-12b/instruct,openthinker3-7b/instruct,llama3.1-8b/instruct,harc-llama3.1-8b/instruct,phi-4/instruct
