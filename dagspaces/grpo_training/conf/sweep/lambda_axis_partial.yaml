# @package _global_
# COLM paper sweep — λ axis PARTIAL RERUN (contrastive_lambda) at ρ=0.
#
# Reruns only the cells from sweep/lambda_axis.yaml whose original run
# (multirun/2026-05-13_lambda_axis_sweep/12-31-50) was corrupted because the
# external judge + embedding serve jobs timed out partway through training:
#
#   λ ∈ {1.0, 1.5, 2.0}   (contrastive_ratio=0)
#
# The four cells λ ∈ {0.0, 0.25, 0.5, 0.75} finished cleanly in that original
# run and are NOT repeated here — reuse their checkpoints as-is.
#
# Prerequisites — RESTART the embedding + judge servers with longer timeouts
# first, then export before launch (same as sweep/lambda_axis.yaml):
#   EMBEDDING_SERVER_URL   (e.g. http://klara:8001 — Qwen3-Embedding-8B)
#   JUDGE_SERVER_URL       (e.g. http://klara:8002 — Qwen3.6-27B)
#   SFT_CHECKPOINT_PATH    (the SFT LoRA dir feeding into GRPO)
#   NORM_UNIVERSES_PATH    (norm_universes.json from norm_universe stage)
#   CI_REASONING_PATH      (chunks parquet with chunk_text + source_id)
#   NORM_EMBEDDINGS_PATH   (optional — per-book .npy embeddings)
#
# Usage:
#   python -m dagspaces.grpo_training.cli +sweep=lambda_axis_partial
#
# Each cell writes its checkpoint to:
#   multirun/<date>_lambda_axis_partial_sweep/<time>/lambda=<value>/grpo_only_online_external/outputs/grpo/checkpoint
#
# IMPORTANT — eval-yaml generation after this rerun:
# experiment.name is intentionally distinct from `lambda_axis_sweep` so the
# autodiscovery in scripts/build_sweep_model_yamls.py (which takes only the
# most-recent `*_lambda_axis_sweep/*` dir) does NOT silently drop the four
# good cells. Once this rerun finishes, generate the eval model yamls by
# passing BOTH run dirs explicitly:
#
#   python scripts/build_sweep_model_yamls.py \
#     --run-dir multirun/2026-05-13_lambda_axis_sweep/12-31-50 \
#     --run-dir multirun/<date>_lambda_axis_partial_sweep/<time> \
#     --force
#
# discover_cells() walks any --run-dir given regardless of experiment.name, so
# the four clean cells from the original dir plus the three reran cells from
# the partial dir together reconstruct the full 7-cell λ axis. Pass --force
# only if regenerating yamls that already exist for the corrupted cells.

defaults:
  - override /pipeline: grpo_only_online_external
  - override /model: qwen3.5-9b/sft-ci
  - override /training/grpo: online_rground_external

experiment:
  name: lambda_axis_partial_sweep

# Pin contrastive_ratio=0 so this is a pure λ axis at the canonical ρ=0 setting.
training:
  grpo:
    contrastive_ratio: 0.0

hydra:
  mode: MULTIRUN
  launcher:
    # 3 concurrent GRPO trainings (one per reran cell). Each consumes one
    # slurm_train_1x job and shares the external embedding+judge servers.
    array_parallelism: 3
  sweep:
    subdir: lambda=${training.grpo.contrastive_lambda}
  sweeper:
    params:
      training.grpo.contrastive_lambda: 1.0,1.5,2.0
