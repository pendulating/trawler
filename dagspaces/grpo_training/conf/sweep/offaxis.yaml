# @package _global_
# COLM paper sweep — 4 off-axis interaction cells.
#
# Cartesian product: λ ∈ {0.5, 1.5} × ρ ∈ {0.10, 0.50} = 4 cells. Bracket
# the λ=1.0 / ρ=0 origin so the paper can claim that (λ, ρ) interactions
# at the corners do not flip the conclusions drawn from either axis alone.
#
# See sweep/lambda_axis.yaml for prerequisites + usage notes.
#
# Usage:
#   python -m dagspaces.grpo_training.cli +sweep=offaxis

defaults:
  - override /pipeline: grpo_only_online_external
  - override /model: qwen3.5-9b/sft-ci
  - override /training/grpo: online_rground_external

experiment:
  name: offaxis_sweep

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 3
  sweep:
    subdir: lambda=${training.grpo.contrastive_lambda}_ratio=${training.grpo.contrastive_ratio}
  sweeper:
    params:
      training.grpo.contrastive_lambda: 0.5,1.5
      training.grpo.contrastive_ratio: 0.10,0.50
