# @package training.sft
# SFT loss: dft = Dynamic Fine-Tuning (arXiv:2508.05629), the 2026-07-18+
# default; null = TRL stock loss (chunked_nll), used by all earlier runs.
# NOTE dft materializes full logits (B x 4096 x ~200k vocab) — watch VRAM on
# this 2-rank FSDP cell; fall back to null if it OOMs.
loss_type: dft

# Best-epoch selection OFF for this cell only: load_best_model_at_end + PEFT
# adapter reload under 2-rank FSDP is the least-proven combo in the sweep, and
# this is a ~22h run — do not risk an end-of-train failure. Per-epoch
# checkpoints are still saved (save_strategy: epoch) and eval_loss per epoch
# is in trainer_state.json, so the best epoch can be picked post-hoc.
select_best_epoch: false
# SFT config for GPT-OSS-20B on 2×A6000 with FSDP.
# Dequantized from Mxfp4 to bf16 (~40GB), too large for single GPU.
# FSDP shards the model across GPUs (DDP replicates, which OOMs).
num_epochs: 3
learning_rate: 1.0e-5
per_device_batch_size: 1
gradient_accumulation_steps: 16
warmup_ratio: 0.1
weight_decay: 0.01
max_seq_length: 4096
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_grad_norm: 1.0
bf16: true
dataloader_num_workers: 4
logging_steps: 10
save_strategy: epoch

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear
  task_type: CAUSAL_LM

sample_fraction: null
include_negative_examples: true

# FSDP: shard model across GPUs (required — 40GB bf16 model doesn't fit on one 48GB A6000)
fsdp:
  strategy: "full_shard auto_wrap"
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  backward_prefetch: BACKWARD_PRE
  forward_prefetch: false
  cpu_ram_efficient_loading: true
