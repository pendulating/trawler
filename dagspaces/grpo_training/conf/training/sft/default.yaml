# @package training.sft
num_epochs: 3
learning_rate: 2.0e-5
per_device_batch_size: 2
gradient_accumulation_steps: 8
warmup_ratio: 0.1
weight_decay: 0.01
max_seq_length: 8192
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_grad_norm: 1.0
bf16: true
dataloader_num_workers: 4
logging_steps: 10
save_strategy: epoch

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear
  task_type: CAUSAL_LM

# Fraction of training examples to use (0.0–1.0, null = use all)
sample_fraction: null

# Include has_information_exchange=False chunks as negative SFT examples
include_negative_examples: true

# Which gold=False chunks to use as negatives:
#   all         — any has_information_exchange=False chunk (legacy)
#   contentless — only genuinely flow-free chunks (drop has-exchange-but-no-norm
#                 chunks, which taught the v2-v5 over-abstention prior). See
#                 sft_data_prep._is_contentless_chunk and
#                 scripts/proto_contentless_classifier.py.
negative_selection: all

# Per-flow field ablation toggles (SFT instruction-format ablation).
# Each toggle drops the corresponding fields from BOTH the assistant JSON and
# the user-side instruction prose. Base 5-tuple (sender, recipient, subject,
# information_type, transmission_principle) and top-level reasoning +
# has_information_exchange are always emitted.
#
# WARNING (GRPO incompatibility): downstream rewards.py reads `context`,
# `appropriateness`, `norms_invoked`, `is_new_flow`, and `confidence` from each
# flow. SFT checkpoints trained with any flow_*=false are SFT-only artifacts;
# running GRPO on them will silently degrade to default values for missing
# fields (e.g. confidence=5, is_new_flow=False) and is unsupported.
#
# Predefined ablation variants live alongside this file: no_context.yaml,
# no_appropriateness.yaml, no_norms_meta.yaml, no_confidence.yaml, minimal_tuple.yaml.
flow_context: true            # ci_context
flow_appropriateness: true    # ci_appropriateness
flow_norms_meta: true         # bundles ci_norms_invoked + ci_norm_source + ci_is_new_flow
flow_confidence: true         # ci_confidence_qual
