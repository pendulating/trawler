# @package training.sft
# SFT loss (added 2026-07-18):
#   dft  — Dynamic Fine-Tuning (arXiv:2508.05629): per-token NLL rescaled by the
#          token's detached probability. Default for all new SFT runs.
#   null — TRL's stock default (chunked_nll in TRL 1.8.0's non-Liger path); what
#          every pre-2026-07-18 run used. Set this to reproduce those runs.
# CAVEATS with dft: (1) eval_loss is DFT-weighted — NOT comparable to nll-scale
# eval curves from earlier sweeps; (2) full logits are materialized (higher peak
# activation memory than chunked_nll).
loss_type: dft
num_epochs: 3
learning_rate: 2.0e-5
per_device_batch_size: 2
gradient_accumulation_steps: 8
warmup_ratio: 0.1
weight_decay: 0.01
max_seq_length: 8192
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
max_grad_norm: 1.0
bf16: true
dataloader_num_workers: 4
logging_steps: 10
save_strategy: epoch

# ── Held-out evaluation ───────────────────────────────────────────────────────
# Added 2026-07-18. Before this, SFT ran with NO validation set: every
# trainer_state.json in the 2026-07-15 canonical sweep logs `eval keys: NONE`,
# so three epochs of training had no held-out signal and problems only surfaced
# in downstream benchmarks days later.
#
# eval_split:
#   grouped — hold out whole source novels (DEFAULT). Chunks of one novel share
#             characters, style and norms, so a random split puts near-duplicates
#             on both sides and reports an optimistically low eval loss. Grouped
#             measures transfer to an unseen normative universe, which is the
#             claim the project actually makes. Picks the single novel closest to
#             eval_fraction so exactly one universe is withheld; falls back to
#             accumulating the smallest novels if none is large enough.
#   random  — plain random split. Faster to reach a target size and keeps every
#             novel in training, but leaks (see above).
#   none    — no eval set; training loss is the only signal (pre-2026-07-18).
#
# LIMITATION — read before trusting this number: eval loss here is computed on
# held-out examples of the SAME ci_extraction task in the SAME
# `{"reasoning": ...}` target format. A model that over-commits to that output
# shape scores BETTER on this metric while getting WORSE on the ReAct / MCQ /
# Likert benchmarks (openthinker3-7b emitted the SFT's `{"reasoning"` prefix on
# 493/493 PrivacyLens vignettes). This catches overfitting and divergence; it
# does NOT catch format contamination. That needs an out-of-format probe.
eval_split: grouped
eval_fraction: 0.05
eval_seed: 42
eval_strategy: epoch      # epoch | steps | no
eval_steps: null          # only used when eval_strategy=steps

# ── Best-epoch selection & overfitting guards (added 2026-07-18) ─────────────
# select_best_epoch: reload the lowest-eval_loss checkpoint at train end, so
#   the saved adapter is the BEST epoch rather than the last. Requires the
#   held-out set above. Under loss_type=dft the metric is DFT-weighted — valid
#   for within-run ranking only.
# early_stopping_patience: stop after N consecutive evals without eval_loss
#   improvement (null = train all epochs; best-epoch selection still discards
#   overfit epochs, this only saves the compute).
# save_total_limit: cap on retained epoch checkpoints (best is always kept);
#   null keeps all.
select_best_epoch: true
early_stopping_patience: null
save_total_limit: null

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules: all-linear
  task_type: CAUSAL_LM

# Fraction of training examples to use (0.0–1.0, null = use all)
sample_fraction: null

# Include has_information_exchange=False chunks as negative SFT examples
include_negative_examples: true

# Which gold=False chunks to use as negatives:
#   all         — any has_information_exchange=False chunk (legacy)
#   contentless — only genuinely flow-free chunks (drop has-exchange-but-no-norm
#                 chunks, which taught the v2-v5 over-abstention prior). See
#                 sft_data_prep._is_contentless_chunk and
#                 scripts/proto_contentless_classifier.py.
negative_selection: all

# Per-flow field ablation toggles (SFT instruction-format ablation).
# Each toggle drops the corresponding fields from BOTH the assistant JSON and
# the user-side instruction prose. Base 5-tuple (sender, recipient, subject,
# information_type, transmission_principle) and top-level reasoning +
# has_information_exchange are always emitted.
#
# WARNING (GRPO incompatibility): downstream rewards.py reads `context`,
# `appropriateness`, `norms_invoked`, `is_new_flow`, and `confidence` from each
# flow. SFT checkpoints trained with any flow_*=false are SFT-only artifacts;
# running GRPO on them will silently degrade to default values for missing
# fields (e.g. confidence=5, is_new_flow=False) and is unsupported.
#
# Predefined ablation variants live alongside this file: no_context.yaml,
# no_appropriateness.yaml, no_norms_meta.yaml, no_confidence.yaml, minimal_tuple.yaml.
flow_context: true            # ci_context
flow_appropriateness: true    # ci_appropriateness
flow_norms_meta: true         # bundles ci_norms_invoked + ci_norm_source + ci_is_new_flow
flow_confidence: true         # ci_confidence_qual
