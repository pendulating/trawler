# @package training.grpo
# Online R_ground with EXTERNAL embedding + judge servers.
#
# Servers must be launched independently (see scripts/launch_auxiliary_servers.sh)
# and their URLs passed via environment variables. All GPUs on the training
# node go to the policy model — no GPU allocation for servers.
#
# Usage:
#   EMBEDDING_SERVER_URL=http://gpu1:8001 JUDGE_SERVER_URL=http://gpu2:8002 \
#   SFT_CHECKPOINT_PATH=... NORM_UNIVERSES_PATH=... CI_REASONING_PATH=... \
#   python -m dagspaces.grpo_training.cli \
#     pipeline=grpo_only_online_external \
#     training/grpo=online_rground_external \
#     model=qwen3-8b/base

# Master RNG seed — seeds Python random / NumPy / torch up front and is passed
# to GRPOConfig (seed + data_seed). Overridden per-cell by sweep/seed_variance.yaml.
seed: 42

online_rground: true

# External server URLs (required — no managed fallback in this config)
embedding_server_url: ${oc.env:EMBEDDING_SERVER_URL}
judge_server_url: ${oc.env:JUDGE_SERVER_URL}

# Phase-1 optimizer revision (2026-06): the May sweep cells trained with
# G=2 / lr=1e-6 / beta=0 and showed a flat reward curve over all 96 steps —
# 60% of groups had identical R_ground (zero advantage) and the rest were
# judge-noise amplified to ±1 by group std-scaling. The settings below make
# the group statistics non-degenerate and anchor the policy to SFT.
num_generations: 8           # G=2 gave single-pairwise (mostly tied) groups
# v6 (2026-06-19): lr 1e-5 → 2e-5. v5 traces showed a +0.75 within-group
# advantage toward extraction on gold-flow groups that the policy never
# followed — grad_norm ~0.2-0.4, PPO clip never bound (huge headroom), the
# update was simply too weak to leave the SFT abstention basin in 3 epochs.
learning_rate: 2.0e-5
per_device_batch_size: 1
gradient_accumulation_steps: 32   # 32 completions = 4 prompts/step at G=8
num_epochs: 3                # 772 prompts x 1 epoch was too little signal
warmup_ratio: 0.1
# v6: the TRL/HF default cosine schedule decayed lr to ~0 by end-of-run, so the
# back half of v5 did almost no learning. Floor the schedule at 30% of peak.
lr_scheduler_type: cosine_with_min_lr
min_lr_rate: 0.3
max_completion_length: 3072
gradient_checkpointing: true
bf16: true
logging_steps: 10
save_strategy: steps
save_steps: 100

# KL coefficient to the reference policy. The trainer re-wraps the merged
# SFT model with a fresh LoRA, and TRL computes reference logprobs by
# disabling the adapter — so this anchors the policy to the SFT checkpoint
# exactly (no separate ref model loaded).
#
# v8 (2026-06-22): beta 0.0 → 0.02. The v4 rationale (beta=0 to escape the
# SFT basin, DAPO-style) was sound but v6 exposed its cost: with beta=0 + lr
# 2e-5 the policy entropy ran away ~10× (0.6→6.0 nats), which blew the
# vLLM-rollout vs HF-trainer logprob mismatch up ~80× and collapsed the
# importance-sampling ratios (min→1e-15) so token_truncate masked the gradient
# (corr(entropy,logp_diff)=+0.92, corr(entropy,IS)=−0.96 — the clean advantage
# never reached the weights). The v7 pilot (beta=0.02, single-variable, 150
# steps) FIXED this exactly as predicted: entropy bounded 0.58→0.69, IS≈1.0,
# KL mean 0.22, zero masking, every group carrying real reward spread (~0.37).
# β·KL ≈ 0.02×0.06 ≈ 0.001 — a stability floor, NOT an SFT anchor that
# dominates the advantage. REQUIRED before raising update strength
# (num_iterations below): μ>1 moves the policy further from the rollout within
# a batch, which only stays stable with a non-zero entropy floor. Lower beta
# is ruled out (β·KL already negligible; only re-risks the runaway).
# See wiki/grpo_training_field_notes/2026-06-22_v8_plan.md.
beta: 0.02
# ── Clip-Higher (DAPO, v4 2026-06-17) ──
# Decouple the PPO upper clip from the lower (epsilon stays 0.2). Raising the
# upper bound lets the LOW-probability action (here: extraction) take larger
# upward steps instead of being clipped back toward the SFT abstention mode —
# the field-standard lever against mode/entropy collapse. Pairs with beta=0:
# beta→0 unlocks movement, clip-higher directs it toward the rare-correct path.
epsilon_high: 0.28
# ── GRPO inner-iteration count μ (v8 2026-06-22) ──
# num_iterations (μ in the GRPO paper) = optimizer passes per batch of
# generations. TRL default 1 — and at μ=1 the rollout snapshot
# old_per_token_logps is taken at generation time with NO optimizer step
# before the single loss step, so the PPO ratio coef_1 = exp(logπ_θ −
# logπ_θ_old) ≡ 1 and the clip never binds. That is exactly why v4's
# epsilon_high=0.28 was INERT (clip_ratio/high_mean ~1e-4 all run). At μ=2 the
# second inner pass recomputes logπ_θ at UPDATED weights against the frozen
# snapshot → coef_1 departs from 1 → Clip-Higher finally lets advantage>0
# (extraction) tokens take asymmetrically larger up-steps. μ=2 also DOUBLES
# optimizer steps per rollout at judge-cost-neutral cost: generation+judging
# runs every steps_per_generation×μ steps, so the same judged batch is reused
# for both updates. This is the most direct attack on v5/v7's headline failure
# — a +0.72 within-group advantage that is present every step but unfollowed
# (grad_norm ~0.1, PPO clip never binds, lr decays before the policy moves).
# Start at 2, not 4: the v6 entropy/IS-collapse fingerprint surfaces fast if
# μ destabilizes; pairs with beta=0.02 above. trace_metrics.summarize_log_
# history() surfaces it. See 2026-06-22_v8_plan.md.
#
# v9 2026-06-23: REVERTED to μ=1. v8 showed μ=2 reintroduced the entropy
# breakout (~step 240, corr(entropy,logp)=+0.96) for no held-out gain — the
# useful policy movement saturated at the clean ckpt200. With v9's CONCENTRATING
# reward (directional appropriateness multiplier), the stable μ=1 regime should
# now produce movement on its own; re-evaluate μ>1 only if movement stalls.
# See 2026-06-23_v9_plan.md.
num_iterations: 1
# ── vLLM importance-sampling correction mode (v5 2026-06-18) ──
# THE binding constraint behind the v1–v4 over-abstention failures. TRL's
# default vllm_importance_sampling_mode="sequence_mask" sums the per-token
# vLLM-vs-HF logp mismatch over the WHOLE completion, then ZEROES that
# completion's entire gradient if the summed ratio exceeds the cap (3.0).
# v4 traces: extraction completions are 3.0× longer than abstentions
# (median 1348 vs 526 chars) → their summed mismatch is far larger → they
# are preferentially masked to zero, so only the short no-flow gradients
# survive each step. This silences exactly the action we reinforce and
# explains why penalty magnitude (P=0/0.2/0.4) and beta=0 were all dead
# levers — the extraction advantage was computed but zeroed before the
# optimizer ever saw it. "token_truncate" corrects each token's ratio
# individually and CLAMPS (not zeroes) at the cap, so long completions keep
# their gradient. Field-standard (GSPO) choice for variable-length GRPO.
# Single-variable change vs v4 — beta=0, epsilon_high=0.28, P=0.4 all held.
vllm_importance_sampling_mode: token_truncate
# Dr. GRPO: no std-scaling of advantages. Group std-scaling ("group", the
# TRL default) amplifies near-tie judge noise to full ±1 advantages.
scale_rewards: "none"
# DAPO: exclude truncated completions from the loss. Truncated outputs fail
# JSON parsing and score ~0, which otherwise rewards the short no-flow path.
mask_truncated_completions: true

# vLLM for policy model (colocate — all GPUs available for training)
use_vllm: true
vllm_mode: colocate
vllm_tensor_parallel_size: 1
vllm_gpu_memory_utilization: 0.45
vllm_enable_sleep_mode: true
# Qwen3.5-9B declares native max_position=262144. At gpu_memory_utilization=0.45
# (colocated with the optimizer + grads), vLLM 0.19.1's KV-cache pre-check
# fails unless we cap this explicitly. 16384 ≫ (prompt 6k chars ≈ 2k tok +
# max_completion_length 3072) and matches the eval-time engine_kwargs.max_model_len
# used by qwen3.5-9b/*.yaml.
vllm_max_model_length: 16384

enable_thinking_grpo: false
contrastive_ratio: 0.0
# λ=1.0 is the paper-primary cell (sweep origin λ=1.0, ρ=0 — declared the
# main-table setting in conf/sweep/lambda_axis.yaml and ratio_axis.yaml).
# Keep this default aligned so manual single-cell and smoke runs reproduce
# the primary configuration; sweep cells always pin λ explicitly.
contrastive_lambda: 1.0
no_flow_scoring: independent

# ── R_ground scoring mode (Phase 3) ──
# "ranked": one listwise judge call per (group, universe) ranks all G
# same-prompt completions against a shared retrieved norm set; per-candidate
# reward blends rank position with the judge's absolute grounding score
# (rank_weight). Fixes the 60%-tied-groups problem of "absolute" scoring
# (judge scores are quantized at 0.0 / 0.85–1.0, so same-prompt completions
# usually tie → zero advantage). "absolute" preserves the May-sweep behavior.
rground_scoring: ranked
rank_top_k: 5      # norms retrieved per group (shared by all candidates)
rank_weight: 0.5   # blend: rank position vs absolute grounding score
judge_max_workers: 16  # concurrent judge HTTP calls (vLLM batches them)

# ── Deontic appropriateness blend (v6 2026-06-19) ──
# The ranked judge scores topical GROUNDING but is a weak, holistic signal for
# whether the model's appropriate/inappropriate verdict agrees with the
# governing norm's deontic direction — the core of context-relative CI
# reasoning. Blend the deterministic deontic check (norm normative_force →
# expected appropriateness; 95% of norms carry a directional force) into
# R_ground: R = clamp((1-w)*(rank_blend - λ*wrong) + w*app_consistency).
# Reuses deontic.py (same FORCE_TO_GOLD as the vignette gold labels and the
# reranker backend's app_weight). 0.0 = legacy/grounding-only.
# v9: app_weight > 0 acts only as the ON-SWITCH when app_mode="multiplicative"
# (its magnitude is unused there — the floor sets the strength). Kept at 0.3.
rground_app_weight: 0.3

# ── Appropriateness direction (v9 2026-06-23) ──
# "additive" = legacy 0.3 blend: R_ground = (1-w)*grounding + w*app_consistency,
# so a wrong appropriateness verdict costs only ~0.19 of the composite → the
# model hedged ("ambiguous") 73% of the time despite a directional governing
# norm 97% of the time (v8 traces). "multiplicative" = the v9 two-sided reward:
# R_ground = grounding * direction, direction = app_floor + (1-app_floor)*app_cons.
# Correct verdict ×1.0, hedge ×0.7, wrong (e.g. a violation called appropriate)
# ×app_floor. The floor DISCOUNTS rather than zeroes, guarding against deontic
# retrieval noise. See deontic.direction_multiplier, 2026-06-23_v9_plan.md.
rground_app_mode: multiplicative
rground_app_floor: 0.4

# ── Reward composition (Phase 3) ──
# "gated": R = gate(r_uncert, r_complete, r_consist) × disc(r_context,
# r_cohere, r_ground). The gating components are saturated post-SFT; in
# "additive" mode they contribute a near-constant 0.20 offset that dilutes
# the discriminative signal.
# "directional" (v9 2026-06-23): R = gate × content. gate folds the four
# programmatic well-formedness components {r_uncert, r_complete, r_consist,
# r_cohere}; content = weight-normalized {r_context (light), r_ground (dominant,
# already grounding×direction via app_mode above)}. No-flow completions bypass
# the combine and are scored by the gold-aware abstention path (so the post-hoc
# abstention_penalty below is redundant → set to 0.0). Two-sided + simpler.
reward_composition: directional

# ── Unjustified-abstention penalty (2026-06-12) ──
# Flat amount subtracted from a completion that declares NO information flow
# when the gold label says one exists (is_no_flow AND gold_has_exchange=True).
# Never fires on correct abstention (gold False/None). The 2026-06-10 full run
# over-abstained (no-flow rate 0.67 vs gold-implied 0.40) and GRPO did not
# correct it — abstention already scored a low ~0.026, but under
# scale_rewards="none" the shallow ~0.026-vs-extract gap was too weak a signal.
# Dry-run on that run's traces (P=0.2): extract advantage +0.17→+0.27, abstain
# advantage −0.11→−0.18, within-group separation 0.54→0.73, across the ~90% of
# gold-flow groups that are mixed. 0.0 = disabled (preserves legacy behavior).
# v6: kept at 0.4 (held from v3-v5). Correct on gold-YES (norm-governed chunks
# the model should extract). NB the symmetric false-extraction penalty on
# gold=NO was rejected — gold_has_exchange=False is a prescriptive-norm label,
# not a flow label, so many gold=NO chunks contain real flows; see
# scripts/audit_goldno_labels.py. Context-relativity is taught via
# rground_app_weight + the contentless-curated SFT prior instead.
# v9 2026-06-23: set to 0.0. With reward_composition=directional, no-flow
# completions are scored directly by no_flow_reward(gold) (gold=T→0.1 wrong,
# gold=F→0.6 correct, unknown→0.4), which already encodes the two-sided
# abstention signal — this post-hoc subtraction would double-count.
abstention_penalty: 0.0

# ── Variance pre-screening (Phase 2) ──
# Before training, sample num_samples completions per prompt from the SFT
# policy and drop prompts whose group reward std < reward_std_min — those
# groups carry zero GRPO advantage (May sweep: 62% of groups had composite
# gap < 0.05). Set GRPO_PRESCREEN_CACHE to a shared path so sweep cells
# starting from the same SFT checkpoint screen once.
prescreen:
  enabled: true
  num_samples: 8
  reward_std_min: 0.05
  min_keep: 8
  temperature: 1.0
  cache_path: ${oc.env:GRPO_PRESCREEN_CACHE,""}
  # Option 3 (2026-06-12): additionally drop prompts whose SFT samples
  # unanimously abstain (extract_frac == 0) — no flow-decision variance, so
  # the extract-vs-abstain advantage is absent and the abstention_penalty
  # cancels under group-mean centering. Pure-extract groups are kept
  # (R_ground still ranks their quality). Complements abstention_penalty:
  # the penalty sharpens mixed groups, this removes the dead-weight ones.
  # Selection-time knob (not part of the prescreen cache key). false = off.
  # v6: kept true (held from v2-v5) — drops unanimous-abstain gold-no-flow
  # prompts that carry zero extract-vs-abstain advantage.
  require_flow_variance: true

# ── Held-out dev split (Phase 5a) ──
# TRL generates + scores the dev prompts every eval_steps, logging held-out
# reward (eval_reward in W&B) — the first-line generalization signal.
#
# DISABLED (0.0) for colocate runs (2026-06-15): the in-loop eval does a single
# batch-of-G forward whose fp32 full-vocab logits (G=8 × ~3.5k-tok prompt ×
# 152k vocab ≈ 19–25 GB) cannot coexist with the resident colocate vLLM engine
# (vLLM is not put to sleep during the eval logp forward → only ~17 GB free).
# This OOM-killed the v2 full run at step ~250/498 (job 385580). Shrinking vLLM
# util can't free the ~12 GB truly needed without starving vLLM's own weights.
# The promotion gates do NOT need this signal: reward_trend falls back to the
# train-reward curve, and no_flow_rate reads reward_traces.jsonl — both written
# during training. Re-enable ONLY with vllm_mode=server (eval on a separate
# vLLM process) or a non-colocate eval pass.
dev_fraction: 0.0
eval_steps: 50

# ── Judgment-vignette mix (Phase 4) ──
# 30% of training prompts are norm-judgment vignettes derived from the norm
# universes — verifiable binary rewards on benchmark-shaped tasks, bridging
# CI extraction → privacy judgment. (The May sweep ran 0.0; GRPO's only
# consistent wins were on judgment-flavored metrics.)
vignette_ratio: 0.3
judgment_reward_weights:
  - 0.50
  - 0.25
  - 0.25

# Reward component weights
reward_weights:
  - 0.10   # r_uncert  (task clarity / schema validity — gating)
  - 0.05   # r_complete (structural completeness — saturated post-SFT)
  - 0.05   # r_consist (internal consistency — saturated post-SFT)
  - 0.20   # r_context (context identification)
  - 0.10   # r_cohere (reasoning-to-extraction coherence)
  - 0.50   # r_ground (normative grounding — ONLINE judge)

context_embedding_model: all-MiniLM-L6-v2
