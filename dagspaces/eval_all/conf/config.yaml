defaults:
  - _self_
  - pipeline: all_benchmarks

experiment:
  name: eval_all

runtime:
  debug: false
  sample_n: null
  skip_vlm: false
  job_memory_gb: 64    # used by GPU launchers (via ${runtime.job_memory_gb})

# Meta whitelist/blacklist for benchmarks. Empty lists = no filter (every
# enabled benchmark runs). When `include` is non-empty it acts as a
# whitelist and `exclude` is ignored. `enabled=false` on a benchmark
# always wins, so a Hydra config group like
# `+benchmark_filter=factuality_only` can't accidentally turn on a
# benchmark the operator has explicitly disabled at the CLI.
#
# Named reusable filters live in conf/benchmark_filter/; invoke via
# `+benchmark_filter=<name>` (e.g. factuality_only, ci_only).
benchmark_filter:
  include: []
  exclude: []

# Shared vLLM server across all benchmarks. When enabled, eval_all launches
# one long-lived SLURM GPU job that hosts the model via vllm's
# OpenAI-compatible server; each benchmark subprocess inherits
# ``VLLM_SERVER_URL`` and routes inference through HTTP instead of
# loading the model fresh.
server_mode:
  enabled: false
  launcher: slurm_gpu_1x
  port: 0                        # 0 = pick a free ephemeral port (a fixed port
                                 # collides when two cells' servers share a node);
                                 # a non-zero request falls back to ephemeral if taken
  served_model_name: ""          # default: canonical model.model_source path
                                 # (weights themselves load via the /scratch registry)
  tensor_parallel_size: null     # default: from model.engine_kwargs
  max_model_len: null            # default: from model.engine_kwargs — NB one engine
                                 # serves ALL benchmarks, so this must cover the
                                 # longest (privacylens agent ≈ 13.4k → 16384)
  gpu_memory_utilization: 0.90
  max_num_seqs: null             # null = vLLM serve default (256). The model yamls'
                                 # 16 is an in-process norm-extraction setting.
  enforce_eager: null            # null = inherit model.engine_kwargs.enforce_eager
                                 # (parity with in-process evals); false for speed
  max_runtime_min: 720           # server job walltime cap — orphan guard for a
                                 # SIGKILLed monitor (cleanup is atexit/SIGTERM only)
  infer_launcher: slurm_cpu      # launcher swapped into server-routable inference
                                 # nodes (via TRAWLER_EVAL_INFER_LAUNCHER) so they
                                 # don't hold an idle GPU while routing over HTTP
  reasoning_parser: auto         # "auto" detects from model family; "none" disables
  # LoRA checkpoints are handled automatically: model.lora_path is key-remapped
  # if needed, served as adapter "sft" (--enable-lora), and clients address it
  # via VLLM_SERVER_LORA_NAME. gpt-oss/harmony models are refused (their
  # final-channel parsing needs the in-process path).
  startup_timeout_s: 900
  extra_args: []                 # additional CLI args passed to api_server

wandb:
  project: eval-all

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
