# @package _global_
# Hydra sweep: vlm_geoprivacy ONLY, over the six gemma-4 canonical cells that
# never ran it. Backfills the VLM Q7 column.
#
# Why these cells are empty
# -------------------------
# The gemma-4 line (E2B / E4B / 12B / 31B) is any-to-any multimodal, but
# `model_family: gemma-4` was missing from eval_all/orchestrator.py
# `_VLM_FAMILIES`, which listed gemma-3 only. The dispatcher's `vlm_only` gate
# therefore classified every gemma-4 checkpoint as "text-only" and skipped
# vlm_geoprivacy — silently, as a normal skip rather than a failure. So the six
# gemma-4 cells in 2026-07-1{6,7}_eval_canonical_{instruct,sft_gemma4} carry no
# Q7 value despite the benchmark being applicable.
#
# Fixed 2026-07-18: "gemma-4" added to _VLM_FAMILIES, plus a dedicated
# `build_gemma4_prompt` in vlm_geoprivacy_bench/model_prompts.py. The gemma-3
# builder could NOT be reused — Gemma4Processor renders a list-valued system
# message as its literal Python repr:
#     <|turn>system\n[{'type': 'text', 'text': 'SYS'}]<turn|>
# which would have silently corrupted the system prompt rather than erroring.
# The gemma-4 builder passes the system turn as a plain string and keeps the
# structured image+text block for the user turn. Verified against all four
# checkpoints: each renders the `<|image|>` token with a clean system prompt.
#
# Scope: the SIX 1-GPU gemma-4 canonical cells. gemma-4-31b is NOT here — it is
# TP=2 and is covered by eval_teacher_gemma4_31b_2026_07_18.yaml, which now runs
# vlm_geoprivacy as part of its full roster.
#
# vlm_geoprivacy is gold-scored MCQ (Q7 = location-granularity accuracy), so
# this sweep sends NO judge traffic and the sidecar is off. That also means
# these cells are directly comparable with the Q7 values the Qwen3.5 family
# already produced, regardless of judge era.
#
# Usage:
#   python -m dagspaces.eval_all.cli --multirun \
#       +sweep=eval_gemma4_q7_backfill_2026_07_18
#
# Sampled smoke test first — RECOMMENDED. No gemma-4 checkpoint has ever run
# this benchmark, so the vLLM multimodal path is unexercised for this family:
#   python -m dagspaces.eval_all.cli \
#       +sweep=eval_gemma4_q7_backfill_2026_07_18 \
#       model=gemma-4-e2b/instruct runtime.debug=true runtime.sample_n=5

experiment:
  name: eval_gemma4_q7_backfill

# vlm_geoprivacy-only whitelist. `include` is a whitelist: when non-empty only
# these run, and every other still-enabled benchmark is suppressed.
benchmark_filter:
  include:
    - vlm_geoprivacy
  exclude: []

# Gold-scored MCQ -> no judge traffic. Disable the sidecar so this sweep neither
# depends on nor contends with the klara:8002 judge server.
judge_sidecar:
  enabled: false

hydra:
  mode: MULTIRUN
  launcher:
    # Six 1-GPU cells, no judge contention.
    array_parallelism: 3
    setup:
      - export PATH=$HOME/.local/bin:${oc.env:TRAWLER_SLURM_BIN,/usr/local/slurm/current/bin}:$PATH
      - export HYDRA_FULL_ERROR=1
      - source ~/.bashrc
      # Same vLLM 0.25 pin as the sweeps being backfilled. Required regardless:
      # gemma-4-12b is Gemma4UnifiedForConditionalGeneration, absent from
      # 0.19.1's ModelRegistry entirely.
      - source /share/pierson/matt/UAIR/.venv-vllm025cu129/bin/activate
      - unset WANDB_DISABLED
      - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
      - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
      - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
      - export WANDB_SILENT=true
      - export WANDB_DISABLE_SERVICE=true
      - export TOKENIZERS_PARALLELISM=false
      - export PYTHONUNBUFFERED=1
      - export PYTHONPATH=${oc.env:TRAWLER_PROJECT_ROOT,/share/pierson/matt/UAIR}:$PYTHONPATH
  sweeper:
    params:
      # The six 1-GPU gemma-4 canonical cells, matching the rows in
      # eval_canonical_instruct.yaml / eval_canonical_sft_gemma4.yaml.
      model: >-
        gemma-4-e2b/instruct,
        gemma-4-e4b/instruct,
        gemma-4-12b/instruct,
        gemma-4-e2b/sft-canonical,
        gemma-4-e4b/sft-canonical,
        gemma-4-12b/sft-canonical
