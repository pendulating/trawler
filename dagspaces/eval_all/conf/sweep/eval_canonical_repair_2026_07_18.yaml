# @package _global_
# Hydra sweep: repair the two recoverable cell failures from the 2026-07-17
# canonical-set sweeps. GoldCoin + ConfAIde only; both are gold-scored, so this
# sweep sends NO judge traffic.
#
# Upstream failures (multirun/2026-07-17_eval_canonical_{sft_gemma4/12-48-19,
# instruct/21-21-52}, per each cell's failures.json):
#
#   llama3.1-8b/sft-canonical   goldcoin  "FAILED (rc=1)" at dispatch.
#       Operator-cancelled mid-run, not a model or config fault — every other
#       benchmark in that cell (privacylens, cirl_vignettes, confaide, mmlu)
#       completed clean. Straight re-run.
#
#   harc-llama3.1-8b/instruct   confaide  "FAILED (rc=1)" at dispatch.
#       All SIX llm_inference tiers (2a, 2b, 3_control, 3_free, 3_info,
#       3_sharing) completed and wrote output; the run died in the local
#       parse_responses step, which got as far as writing
#       parse_responses_tier2a/dataset.parquet and produced no traceback in any
#       captured log (confaide.log is empty; the cell log is 2 lines of submitit).
#       Re-running is both the fix attempt and the way to get a real log — if it
#       fails again the failure is reproducible and worth a parser investigation.
#
# The 2x2 cross-product runs two cells that already have good values:
#   llama3.1-8b/sft-canonical confaide      (have 51.8)
#   harc-llama3.1-8b/instruct goldcoin      (have 80.8 / 49.0)
# These are kept deliberately as regression checks — same philosophy as
# privacylens_failed_revalidate_2026_06_03.yaml. Both benchmarks are cheap and
# judge-free, so the redundancy costs little. They are temperature-0 evals and
# should reproduce; if they DON'T, that is itself a finding worth knowing before
# the numbers go in the paper.
#
# NOT included, deliberately:
#
#   openthinker3-7b/sft-canonical  privacylens — NOT an infrastructure failure.
#       The judge batch "completed" with a 0-byte requests.jsonl because nothing
#       upstream was parseable: the SFT checkpoint emits JSON ({"reasoning":...})
#       instead of the ReAct Thought:/Action: format on 493/493 vignettes
#       (vs 401/493 carrying "Action:" for openthinker3-7b/instruct). At
#       temperature 0 this is deterministic — re-running reproduces it exactly.
#       Decision 2026-07-18: report as a format-collapse finding (0% action
#       format compliance) and leave the cell blank, rather than re-running,
#       relaxing the shared parser, or adding a model-specific prompt nudge —
#       the latter two would change what the metric means for the other ten
#       models. See also reasoning_revalidate_openthinker_2026_06_08.yaml: this
#       checkpoint family has degraded on output format twice before.
#
#   gpt-oss-20b/sft-canonical — every benchmark failed; separate root cause
#       (vLLM 0.25.0 fused-MoE LoRA path hands the attention LoRA shrink kernel
#       a non-contiguous tensor -> assert inputs.is_contiguous() ->
#       EngineDeadError). Tracked separately; needs the engine fix before any
#       re-run is meaningful.
#
# Both benchmarks are gold-scored -> no judge server needed, sidecar off.
#
# Usage:
#   python -m dagspaces.eval_all.cli --multirun \
#       +sweep=eval_canonical_repair_2026_07_18
#
# Sampled smoke test first (local, no SLURM):
#   python -m dagspaces.eval_all.cli \
#       +sweep=eval_canonical_repair_2026_07_18 \
#       model=llama3.1-8b/sft-canonical runtime.debug=true runtime.sample_n=20 \
#       hydra/launcher=null

experiment:
  name: eval_canonical_repair

# Whitelist: only these two run; every other still-enabled benchmark (mmlu,
# privacylens, cirl_vignettes, vlm_geoprivacy) is suppressed.
benchmark_filter:
  include:
    - goldcoin
    - confaide
  exclude: []

# Gold-scored only -> no judge traffic. Disable the sidecar so this sweep does
# not depend on (or contend with) the klara:8002 judge server.
judge_sidecar:
  enabled: false

hydra:
  mode: MULTIRUN
  launcher:
    # Only 2 cells and no judge contention; run them side by side.
    array_parallelism: 2
    setup:
      - export PATH=$HOME/.local/bin:${oc.env:TRAWLER_SLURM_BIN,/usr/local/slurm/current/bin}:$PATH
      - export HYDRA_FULL_ERROR=1
      - source ~/.bashrc
      # Same vLLM 0.25 pin as the sweeps being repaired, so the repaired cells
      # are produced under the identical engine version as their row-mates.
      - source /share/pierson/matt/UAIR/.venv-vllm025cu129/bin/activate
      - unset WANDB_DISABLED
      - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
      - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
      - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
      - export WANDB_SILENT=true
      - export WANDB_DISABLE_SERVICE=true
      - export TOKENIZERS_PARALLELISM=false
      - export PYTHONUNBUFFERED=1
      - export PYTHONPATH=${oc.env:TRAWLER_PROJECT_ROOT,/share/pierson/matt/UAIR}:$PYTHONPATH
  sweeper:
    params:
      model: >-
        llama3.1-8b/sft-canonical,
        harc-llama3.1-8b/instruct
