# @package _global_
# Hydra sweep: eval_all over all 32 SFT pair-ablation LoRAs from
# 2026-04-28 (the full 2^4 grid × {base, instruct} backbones).
#
# Source artifacts:
#   /share/pierson/matt/UAIR/multirun/2026-04-28_sft_pair_ablation/20-11-11  (qwen3.5-9b/base)
#   /share/pierson/matt/UAIR/multirun/2026-04-28_sft_pair_ablation/18-34-09  (qwen3.5-9b/instruct)
# Per-ablation model yamls live under
#   dagspaces/common/conf/model/qwen3.5-9b/{base,instruct}/ctx-*_appr-*_norms-*_conf-*.yaml
# and were generated by scripts/generate_ablation_model_yamls.py.
#
# JUDGE_SERVER_URL is intentionally NOT exported here — every job inherits it
# from server.env via ensure_dotenv() at process start.
#
# Usage:
#   python -m dagspaces.eval_all.cli --multirun +sweep=sft_pair_ablation

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 3
    setup:
      - export PATH=$HOME/.local/bin:${oc.env:TRAWLER_SLURM_BIN,/usr/local/slurm/current/bin}:$PATH
      - export HYDRA_FULL_ERROR=1
      - source ~/.bashrc
      - source ${oc.env:TRAWLER_VENV_ACTIVATE,/share/pierson/matt/UAIR/.venv/bin/activate}
      - unset WANDB_DISABLED
      - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
      - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
      - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
      - export WANDB_SILENT=true
      - export WANDB_DISABLE_SERVICE=true
      - export TOKENIZERS_PARALLELISM=false
      - export PYTHONUNBUFFERED=1
      - export PYTHONPATH=${oc.env:TRAWLER_PROJECT_ROOT,/share/pierson/matt/UAIR}:$PYTHONPATH
  sweeper:
    params:
      model: >-
        qwen3.5-9b/base/ctx-False_appr-False_norms-False_conf-False,
        qwen3.5-9b/base/ctx-False_appr-False_norms-False_conf-True,
        qwen3.5-9b/base/ctx-False_appr-False_norms-True_conf-False,
        qwen3.5-9b/base/ctx-False_appr-False_norms-True_conf-True,
        qwen3.5-9b/base/ctx-False_appr-True_norms-False_conf-False,
        qwen3.5-9b/base/ctx-False_appr-True_norms-False_conf-True,
        qwen3.5-9b/base/ctx-False_appr-True_norms-True_conf-False,
        qwen3.5-9b/base/ctx-False_appr-True_norms-True_conf-True,
        qwen3.5-9b/base/ctx-True_appr-False_norms-False_conf-False,
        qwen3.5-9b/base/ctx-True_appr-False_norms-False_conf-True,
        qwen3.5-9b/base/ctx-True_appr-False_norms-True_conf-False,
        qwen3.5-9b/base/ctx-True_appr-False_norms-True_conf-True,
        qwen3.5-9b/base/ctx-True_appr-True_norms-False_conf-False,
        qwen3.5-9b/base/ctx-True_appr-True_norms-False_conf-True,
        qwen3.5-9b/base/ctx-True_appr-True_norms-True_conf-False,
        qwen3.5-9b/base/ctx-True_appr-True_norms-True_conf-True,
        qwen3.5-9b/instruct/ctx-False_appr-False_norms-False_conf-False,
        qwen3.5-9b/instruct/ctx-False_appr-False_norms-False_conf-True,
        qwen3.5-9b/instruct/ctx-False_appr-False_norms-True_conf-False,
        qwen3.5-9b/instruct/ctx-False_appr-False_norms-True_conf-True,
        qwen3.5-9b/instruct/ctx-False_appr-True_norms-False_conf-False,
        qwen3.5-9b/instruct/ctx-False_appr-True_norms-False_conf-True,
        qwen3.5-9b/instruct/ctx-False_appr-True_norms-True_conf-False,
        qwen3.5-9b/instruct/ctx-False_appr-True_norms-True_conf-True,
        qwen3.5-9b/instruct/ctx-True_appr-False_norms-False_conf-False,
        qwen3.5-9b/instruct/ctx-True_appr-False_norms-False_conf-True,
        qwen3.5-9b/instruct/ctx-True_appr-False_norms-True_conf-False,
        qwen3.5-9b/instruct/ctx-True_appr-False_norms-True_conf-True,
