# @package _global_
# Hydra sweep: re-run the FULL benchmark roster for gpt-oss-20b/sft-canonical,
# the one canonical-set cell that produced no metrics at all.
#
# What happened (multirun/2026-07-17_eval_canonical_sft_gemma4/12-48-19/10):
# all five dispatched benchmarks failed identically, none reaching a single
# generated token:
#
#   vllm/lora/ops/triton_ops/lora_shrink_op.py:182  assert inputs.is_contiguous()
#   <- gpt_oss.py:174 qkv_proj <- punica add_lora_linear  =>  EngineDeadError
#
# Root cause: GPT-OSS-20B is MoE, so vLLM 0.25.0 routes it through the fused-MoE
# LoRA manager ("MoE model detected. Using fused MoE LoRA implementation."). Our
# adapter targets ONLY q/k/v/o_proj -- no expert weights whatsoever -- so that
# machinery does nothing for us except hand the *attention* LoRA shrink kernel a
# non-contiguous tensor. In EAGER mode that tensor is a bare view and the assert
# fires; under torch.compile the hidden states are materialised contiguously and
# it does not. Same upstream bug family as vllm-project/vllm#26976 and #28640
# (a module LoRA-wrapped when the adapter holds no weights for it).
#
# Isolated on one GPU 2026-07-18, job 24462 (.debug/gptoss_lora):
#   control_nolora  base model, no adapter          PASS
#   repro           sweep engine args + adapter     FAIL  (the assert)
#   contig_patch    in-process monkeypatch          FAIL  (inconclusive: the
#                   model runs in a SPAWNED worker that re-imports vllm, so the
#                   parent-process patch never reached it -- noted so nobody
#                   re-tries monkeypatching as a fix)
#   no_eager        adapter + torch.compile         PASS
#
# Fix: `enforce_eager: false` for gpt-oss-20b/sft-canonical. Applied at the
# source in scripts/build_canonical_sft_model_yamls.py (see MOE_MODEL_FAMILIES /
# family_is_moe) so regenerating the yamls cannot silently reintroduce it; the
# other ten sft-canonical yamls are unchanged and keep enforce_eager: true.
#
# Note this also IMPROVES comparability rather than costing it: the
# <family>/instruct baselines never set enforce_eager, so gpt-oss-20b/instruct
# already ran compiled in 2026-07-17_eval_canonical_instruct. The repaired SFT
# cell now matches its own zero-shot row's engine mode.
#
# Full roster (no benchmark_filter) to match the sweep being repaired: goldcoin,
# privacylens, cirl_vignettes, confaide, mmlu. vlm_geoprivacy self-skips for
# this non-VLM checkpoint, as it did originally.
#
# Required cluster setup -- PrivacyLens is judge-dependent:
#   sbatch scripts/judge_server.sub    # must report /v1/models before launch
# Judge MUST be Gemma-4-31B-it to stay row-comparable with the rest of the
# canonical sweep. Confirm the served model before trusting the PrivacyLens row:
#   curl -s $JUDGE_SERVER_URL/v1/models | python -m json.tool
#
# Usage:
#   python -m dagspaces.eval_all.cli --multirun \
#       +sweep=eval_canonical_gptoss_refix_2026_07_18
#
# Sampled smoke test first -- STRONGLY recommended, since the whole point is
# that this checkpoint previously died at engine init:
#   python -m dagspaces.eval_all.cli \
#       +sweep=eval_canonical_gptoss_refix_2026_07_18 \
#       runtime.debug=true runtime.sample_n=5 hydra/launcher=null

experiment:
  name: eval_canonical_gptoss_refix

hydra:
  mode: MULTIRUN
  launcher:
    # Single cell.
    array_parallelism: 1
    setup:
      - export PATH=$HOME/.local/bin:${oc.env:TRAWLER_SLURM_BIN,/usr/local/slurm/current/bin}:$PATH
      - export HYDRA_FULL_ERROR=1
      - source ~/.bashrc
      # Same vLLM 0.25 pin as the sweep being repaired.
      - source /share/pierson/matt/UAIR/.venv-vllm025cu129/bin/activate
      - unset WANDB_DISABLED
      - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
      - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
      - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
      - export WANDB_SILENT=true
      - export WANDB_DISABLE_SERVICE=true
      - export TOKENIZERS_PARALLELISM=false
      - export PYTHONUNBUFFERED=1
      - export PYTHONPATH=${oc.env:TRAWLER_PROJECT_ROOT,/share/pierson/matt/UAIR}:$PYTHONPATH
      - export JUDGE_SERVER_URL=http://klara.tech.cornell.edu:8002
  sweeper:
    params:
      model: gpt-oss-20b/sft-canonical
