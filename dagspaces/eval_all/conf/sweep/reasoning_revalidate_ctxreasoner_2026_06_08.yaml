# @package _global_
# Per-model revalidation sweep — context-reasoner/ppo ONLY.
#
# Supersedes reasoning_loop_revalidate_2026_06_07.yaml, which applied a single
# repetition_penalty per-benchmark across BOTH reasoning models. The 2026-06-07
# run (multirun/2026-06-07_eval_all/14-15-22) proved that was too coarse:
# repetition_penalty=1.3 helped exactly ONE (model x benchmark) cell and harmed
# the other three. Per-model sweeps let each model carry only the knobs it needs
# (the override scoping the user asked for; nothing is hardcoded in stage code).
#
# context-reasoner/ppo residuals and the fix this sweep applies:
#   cirl_vignettes  (parse_responses 0.477 -> 0.874 with temp0.6 + rep1.3)
#       The <CI>...</CI><|begin_of_solution| loop. temp0.6 (model config) alone
#       only half-broke it; repetition_penalty=1.3 killed it (length-truncation
#       37% -> 1%). KEEP rep1.3 here — this is the one cell it helps.
#   confaide parse_responses_2a  (0.755 baseline at temp0.0; regressed to 0.653
#       at the global temp0.6 from Task 7; 0.674 at temp0.0+rep1.3)
#       rep penalty HURT confaide. Revert to temp0.0 and DROP rep. The residual
#       <|begin_of_thought>...<|end_of_solution| wrapper that buried the rating
#       is now handled by a model-agnostic parser fix (confaide/stages/
#       parse_responses.py: malformed-sentinel strip + parenthesised-grid
#       fallback + "strong (dis)agreement" phrasing), which lifts THIS run's
#       degraded text to 0.776 and should clear higher without rep penalty.
#
# Usage:
#   python -m dagspaces.eval_all.cli --multirun \
#       +sweep=reasoning_revalidate_ctxreasoner_2026_06_08

benchmark_filter:
  include:
    - confaide
    - cirl_vignettes
  exclude: []

# Gold-scored only -> no judge traffic. Disable the sidecar.
judge_sidecar:
  enabled: false

benchmarks:
  confaide:
    # Revert the global temp=0.6 back to the deterministic rating default; the
    # buried-rating parser fix (not a sampling knob) recovers the wrapped CoT.
    extra_args:
      - sampling_params.temperature=0.0
  cirl_vignettes:
    # Keep the validated temp=0.6 (model config) and the loop-breaking penalty.
    extra_args:
      - +sampling_params.repetition_penalty=1.3

hydra:
  mode: MULTIRUN
  launcher:
    array_parallelism: 1
    setup:
      - export PATH=$HOME/.local/bin:${oc.env:TRAWLER_SLURM_BIN,/usr/local/slurm/current/bin}:$PATH
      - export HYDRA_FULL_ERROR=1
      - source ~/.bashrc
      - source ${oc.env:TRAWLER_VENV_ACTIVATE,/share/pierson/matt/UAIR/.venv/bin/activate}
      - unset WANDB_DISABLED
      - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
      - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
      - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
      - export WANDB_SILENT=true
      - export WANDB_DISABLE_SERVICE=true
      - export TOKENIZERS_PARALLELISM=false
      - export PYTHONUNBUFFERED=1
      - export PYTHONPATH=${oc.env:TRAWLER_PROJECT_ROOT,/share/pierson/matt/UAIR}:$PYTHONPATH
  sweeper:
    params:
      model: context-reasoner/ppo
