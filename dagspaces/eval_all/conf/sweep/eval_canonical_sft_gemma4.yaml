# @package _global_
# Hydra sweep: full eval_all over the canonical model set, SFT'd on the
# 2026-07-12 Gemma-4-31B-teacher fiction10 flows (contentless-v6 recipe).
#
# Upstream: multirun/2026-07-15_sft_canonical_gemma4{,_gptoss}. Each model's
# `<family>/sft-canonical` yaml was generated by
#   python scripts/build_canonical_sft_model_yamls.py --write
# which selects, per model, the MOST RECENT run that actually produced an
# adapter. That rule matters here: the three gemma-4 cells and gpt-oss-20b each
# failed at model-load in earlier waves and were retried, so the naive
# "latest timestamp" pick would grab an empty checkpoint dir.
#
#   qwen3.5-2b/4b/9b, openthinker3-7b,   00-07-44 (first wave, clean)
#     llama3.1-8b, harc-llama3.1-8b, phi-4
#   gemma-4-e2b, gemma-4-e4b            09-37-54 (retry after arch-load fail)
#   gemma-4-12b                         10-47-28 (third attempt)
#   gpt-oss-20b                         09-37-54 (retry, _gptoss root)
#
# 11 models = the canonical 13 minus cirl/base and context-reasoner/ppo, which
# are comparison baselines rather than SFT targets (see
# grpo_training/conf/sweep/sft_canonical_gemma4.yaml).
#
# All 11 are TP=1, so the 1-GPU all_benchmarks pipeline covers the whole set;
# no all_benchmarks_2gpu split is needed.
#
# Full roster (no benchmark_filter): goldcoin, privacylens, cirl,
# confaide, vlm_geoprivacy, mmlu. simpleqa_verified stays disabled by default.
#
# Required cluster setup — PrivacyLens is the only judge-dependent benchmark:
#   sbatch scripts/judge_server.sub      # must report /v1/models before launch
#
# Judge: Gemma-4-31B-it on klara:8002 (judge_server.sub's default as of
# 2026-07-16). This is intentional — extraction and judging have moved to the
# gemma family; only embeddings remain on Qwen. It supersedes the Qwen3.6-27B
# judge that wiki/grpo-reward.md:5 still names, so PrivacyLens rows from this
# sweep are NOT judge-comparable with the pre-07-16 PrivacyLens column.
#
# Note the judge is also the teacher that generated this SFT data. Accepted
# tradeoff of the gemma consolidation; recorded here so the coupling is not
# rediscovered as a bug later.
#
# body.model auto-resolves from /v1/models at export time
# (dagspaces/common/judge_export.py), so whatever the server happens to be
# serving is what judges — confirm the served model before trusting rows.
#
# Usage:
#   python -m dagspaces.eval_all.cli --multirun +sweep=eval_canonical_sft_gemma4
#
# Throttle GPU/judge contention:
#   ... hydra.launcher.array_parallelism=2

experiment:
  name: eval_canonical_sft_gemma4

hydra:
  mode: MULTIRUN
  launcher:
    # Each cell is a monitor that fans out GPU children; one shared judge
    # server backs privacylens. 3 concurrent cells matches the 2026-05-30
    # full-roster sweep and leaves headroom on the 8xA6000 box.
    array_parallelism: 3
    setup:
      - export PATH=$HOME/.local/bin:${oc.env:TRAWLER_SLURM_BIN,/usr/local/slurm/current/bin}:$PATH
      - export HYDRA_FULL_ERROR=1
      - source ~/.bashrc
      # vLLM 0.25, NOT server.env's default .venv (0.19.1). gemma-4-12b is
      # Gemma4UnifiedForConditionalGeneration, which 0.19.1's ModelRegistry does
      # not contain at all (see gemma-4-12b/instruct.yaml) — that cell cannot
      # load on the default venv. Pinned for the whole sweep so all 11 cells are
      # compared under one engine version rather than a per-model mix.
      - source /share/pierson/matt/UAIR/.venv-vllm025cu129/bin/activate
      - unset WANDB_DISABLED
      - if [ -n "$WANDB_MODE" ]; then export WANDB_MODE="$WANDB_MODE"; fi
      - if [ -n "$WANDB_BASE_URL" ]; then export WANDB_BASE_URL="$WANDB_BASE_URL"; fi
      - if [ -n "$WANDB_GROUP" ]; then export WANDB_GROUP="$WANDB_GROUP"; fi
      - export WANDB_SILENT=true
      - export WANDB_DISABLE_SERVICE=true
      - export TOKENIZERS_PARALLELISM=false
      - export PYTHONUNBUFFERED=1
      - export PYTHONPATH=${oc.env:TRAWLER_PROJECT_ROOT,/share/pierson/matt/UAIR}:$PYTHONPATH
      - export JUDGE_SERVER_URL=http://klara.tech.cornell.edu:8002
  sweeper:
    params:
      # 11 canonical SFT targets. Generated LoRA yamls, one per family.
      model: >-
        qwen3.5-2b/sft-canonical,
        qwen3.5-4b/sft-canonical,
        qwen3.5-9b/sft-canonical,
        gemma-4-e2b/sft-canonical,
        gemma-4-e4b/sft-canonical,
        gemma-4-12b/sft-canonical,
        openthinker3-7b/sft-canonical,
        llama3.1-8b/sft-canonical,
        harc-llama3.1-8b/sft-canonical,
        phi-4/sft-canonical,
        gpt-oss-20b/sft-canonical
