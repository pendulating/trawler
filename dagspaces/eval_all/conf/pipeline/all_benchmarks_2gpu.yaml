# @package _global_
# Same as all_benchmarks.yaml but dispatches to 2-GPU pipeline variants.
# Use for models requiring tensor_parallel_size=2 (e.g., 27B params).
defaults:
  - /model: qwen3.5-27b/base
  - override /hydra/launcher: slurm_monitor

benchmarks:
  goldcoin:
    module: dagspaces.goldcoin_hipaa.cli
    pipeline: full_eval_2gpu
    vlm_only: false
    enabled: true
  privacylens:
    module: dagspaces.privacylens.cli
    pipeline: privacylens_clean_2gpu
    vlm_only: false
    enabled: true
  cirl:
    module: dagspaces.cirl.cli
    pipeline: cirl_eval_2gpu
    vlm_only: false
    enabled: true
  confaide:
    module: dagspaces.confaide.cli
    pipeline: confaide_eval_2gpu
    vlm_only: false
    enabled: true
  vlm_geoprivacy:
    module: dagspaces.vlm_geoprivacy_bench.cli
    pipeline: mcq_eval_2gpu
    vlm_only: true
    enabled: true
  simpleqa_verified:
    module: dagspaces.simpleqa_verified.cli
    pipeline: simpleqa_verified_async_2gpu
    finalize_pipeline: simpleqa_verified_async_finalize
    vlm_only: false
    enabled: false
  mmlu:
    module: dagspaces.mmlu.cli
    pipeline: mmlu_eval_2gpu
    vlm_only: false
    enabled: false
