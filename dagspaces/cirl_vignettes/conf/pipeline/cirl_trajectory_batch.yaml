# @package _global_
#
# Batch-export variant of cirl_trajectory_eval: trajectory_inference still
# runs locally on GPUs, but leakage and helpfulness judging are exported as
# OpenAI Batch API JSONL files. Finalize with scripts/cirl_trajectory_batch_finalize.py
# after downloading each batch's output.jsonl via:
#   python -m dagspaces.common.batch_api fetch <batch_id> -o <output.jsonl>
defaults:
  - /model: qwen2.5-7b/instruct
  - override /hydra/launcher: slurm_monitor

pipeline:
  output_root: ${hydra:run.dir}/cirl_vignettes
  allow_partial: false
  sources: {}
  graph:
    nodes:
      load_dataset:
        stage: load_dataset
        depends_on: []
        inputs: {}
        outputs:
          dataset: outputs/load_dataset/dataset.parquet
        overrides:
          data:
            probing_levels: [trajectory]

      trajectory_inference:
        stage: trajectory_inference
        depends_on: [load_dataset]
        inputs:
          dataset: load_dataset.dataset
        outputs:
          dataset: outputs/trajectory_inference/dataset.parquet
        launcher: slurm_gpu_1x

      judge_leakage_batch_export:
        stage: judge_leakage_batch_export
        depends_on: [trajectory_inference]
        inputs:
          dataset: trajectory_inference.dataset
        outputs:
          dataset: outputs/judge_leakage_batch/pending.parquet

      judge_helpfulness_batch_export:
        stage: judge_helpfulness_batch_export
        depends_on: [trajectory_inference]
        inputs:
          dataset: trajectory_inference.dataset
        outputs:
          dataset: outputs/judge_helpfulness_batch/pending.parquet
