# @package _global_
#
# Async-judge variant of cirl_trajectory_eval: trajectory_inference runs on
# GPU, but leakage + helpfulness judging are EXPORTED as requests.jsonl +
# manifest.json instead of calling the judge server synchronously (which
# blocked the whole eval cell while 493×N judge calls drained through
# klara:8002). Under eval_all, the judge sidecar fills each export dir's
# output.jsonl while other benchmarks keep running; the cell's monitor then
# drains and dispatches pipeline=cirl_trajectory_async_finalize, which
# aggregates and computes metrics. Same on-disk schema as
# cirl_trajectory_batch — only who fills output.jsonl differs.
defaults:
  - /model: qwen2.5-7b/instruct
  - override /hydra/launcher: slurm_monitor

judge:
  mode: async

pipeline:
  output_root: ${hydra:runtime.output_dir}/cirl_vignettes
  allow_partial: false
  sources: {}
  graph:
    nodes:
      load_dataset:
        stage: load_dataset
        depends_on: []
        inputs: {}
        outputs:
          dataset: outputs/load_dataset/dataset.parquet
        overrides:
          data:
            probing_levels: [trajectory]

      trajectory_inference:
        stage: trajectory_inference
        depends_on: [load_dataset]
        inputs:
          dataset: load_dataset.dataset
        outputs:
          dataset: outputs/trajectory_inference/dataset.parquet
        launcher: ${oc.env:TRAWLER_EVAL_INFER_LAUNCHER,slurm_gpu_1x}

      judge_leakage_batch_export:
        stage: judge_leakage_batch_export
        depends_on: [trajectory_inference]
        inputs:
          dataset: trajectory_inference.dataset
        outputs:
          dataset: outputs/judge_leakage_batch/pending.parquet

      judge_helpfulness_batch_export:
        stage: judge_helpfulness_batch_export
        depends_on: [trajectory_inference]
        inputs:
          dataset: trajectory_inference.dataset
        outputs:
          dataset: outputs/judge_helpfulness_batch/pending.parquet
