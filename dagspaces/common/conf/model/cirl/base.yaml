# @package _global_
model:
  model_source: /share/pierson/matt/zoo/models/CIRL
  model_family: qwen2.5
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    # CIRL is a Qwen2.5 model (native 32K context). The eval harness bumps
    # max_tokens to 4096 for thinking models; a 4096 max_model_len left zero
    # room for the prompt, so every request was rejected ("Prompt too long")
    # and the model produced 100% empty output on every benchmark.
    max_model_len: 32768
    max_num_seqs: 16
