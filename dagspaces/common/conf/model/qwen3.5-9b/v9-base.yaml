# @package _global_
# The v9 keeper's OWN SFT base — the merged pre-GRPO policy that
# qwen3.5-9b/v9-ckpt100.yaml applies its GRPO adapter on top of (same
# `model_source`, no `lora_path`).
#
# WHY THIS EXISTS. The camera-ready table's "Qwen3.5-9B / SFT" row is
# `sft-canonical` — the 2026-07-15 Gemma-4-teacher contentless-v6 SFT. The
# keeper is a DIFFERENT SFT lineage (qwen-teacher era). Reading the GRPO row
