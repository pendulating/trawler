# @package _global_
# v10 GRPO — checkpoint-500 adapter (epoch ~2.91), the final periodic save of the
# 516-step run. Part of the later-checkpoint GoldCoin sweep to locate v10's
# held-out peak: ckpt-100 (0.710 comp-F1, 0.45 Forbid recall) -> ckpt-200 (0.744,
# 0.55, identical to v9-ckpt100). 500 is where the in-universe Forbid
# commit-accuracy dip was deepest — this eval checks the end-of-training held-out
# verdict. Same cost-sensitive directional reward (rground_app_floor_prohibit=0.1);
# only the LoRA advances. Base merged_sft + engine settings identical to ckpt-200.
# Source run: multirun/2026-06-24_grpo_redesign_full_v10/20-48-28 (job 874897).
# See wiki/grpo_training_field_notes/2026-06-24_v10_plan.md.
model:
  model_source: /share/pierson/matt/UAIR/multirun/2026-06-24_grpo_redesign_full_v10/20-48-28/grpo_only_online_external/outputs/grpo/checkpoint/_merged_sft
  model_family: qwen3.5
  lora_path: /share/pierson/matt/UAIR/multirun/2026-06-24_grpo_redesign_full_v10/20-48-28/grpo_only_online_external/outputs/grpo/checkpoint/checkpoint-500
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    max_model_len: 16384
    max_num_seqs: 16
    tensor_parallel_size: 1
    trust_remote_code: true
    enforce_eager: true
    enable_lora: true
    max_lora_rank: 64
  batch_size: 0
  concurrency: 1
