# @package _global_
# m2 wave-A GRPO arm `core` — checkpoint-250 (epoch 1.67 of 3).
#
# verifiable core ONLY: R-VALID gate + R-DIRECT core + the T-VIGNETTE battery
# (task_mix.vignette 0.18). NO judged auxiliaries: reward_auxiliaries=[] per the
# pre-registered grid (grpo_training/conf/sweep/grpo_m2_grid.yaml), which is why
# Appendix B labels this arm -aux. The cell is NAMED `core` because it is the
# core-only arm, not because it runs everything.
#
# Source run: multirun/2026-07-28_grpo_m2_core/21-31-11/cell=core
#   (job 565751, 450/450 steps, COMPLETED; promotion gates HOLD — but the gates
#    that decided that are the ones wiki §17 showed to be defective, which is
#    why this arm is being read on external gold instead.)
#
# LoRA-eval pattern (cf. sft-canonical.yaml / k3-*.yaml): backbone in
# `model_source`, adapter in `lora_path`, `enable_lora` + `max_lora_rank: 64`.
# `model_source` is this cell's MERGED SFT, not stock Qwen3.5-9B, because that
# is the policy GRPO updated from. That merged SFT is
# Qwen3.5-9B + the `sft-canonical` adapter
# (2026-07-15_sft_canonical_gemma4/00-07-44/2) — i.e. the SAME lineage as the
# camera-ready table's "Qwen3.5-9B / SFT" row, and a DIFFERENT lineage from the
# v9 keeper (contentless-v6, qwen-teacher era).
#
# COMPARISON DISCIPLINE: read against `qwen3.5-9b/k3-base` co-run in the same
# sweep (byte-identical merged-SFT weights). Do NOT read against the v9 numbers
# in the paper — different SFT lineage and pre-parity-review PrivacyLens/GoldCoin
# protocol.
model:
  model_source: /share/pierson/matt/UAIR/multirun/2026-07-28_grpo_m2_core/21-31-11/cell=core/grpo_only_online_external/outputs/grpo/checkpoint/_merged_sft
  model_family: qwen3.5
  lora_path: /share/pierson/matt/UAIR/multirun/2026-07-28_grpo_m2_core/21-31-11/cell=core/grpo_only_online_external/outputs/grpo/checkpoint/checkpoint-250
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    max_model_len: 16384
    max_num_seqs: 16
    tensor_parallel_size: 1
    trust_remote_code: true
    enforce_eager: true
    enable_lora: true
    max_lora_rank: 64
  batch_size: 0
  concurrency: 1
