# @package _global_
# v5 of the GRPO redesign series (token_truncate fix; HOLD per gates).
# Final checkpoint-522 adapter on top of the merged SFT base. Built for the
# ground-truth downstream eval vs the sft-ci baseline (the training traces show
# flat gold-label behavior; this confirms it downstream). See
# wiki/grpo_training_field_notes/2026-06-19_redesign_v2-v5_gold_label.md.
model:
  model_source: /share/pierson/matt/UAIR/multirun/2026-06-18_grpo_redesign_full_v5/08-34-48/0/grpo_only_online_external/outputs/grpo/checkpoint/_merged_sft
  model_family: qwen3.5
  lora_path: /share/pierson/matt/UAIR/multirun/2026-06-18_grpo_redesign_full_v5/08-34-48/0/grpo_only_online_external/outputs/grpo/checkpoint
  thinking_mode: off
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    max_model_len: 16384
    max_num_seqs: 16
    tensor_parallel_size: 1
    trust_remote_code: true
    enforce_eager: true
    enable_lora: true
    max_lora_rank: 64
  batch_size: 0
  concurrency: 1
