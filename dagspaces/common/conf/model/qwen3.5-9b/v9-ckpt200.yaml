# @package _global_
# v9 GRPO redesign — INTERMEDIATE checkpoint-200 adapter (epoch ~1.16).
# Same two-sided reward as v9-ckpt100 (appropriateness direction as a
# multiplier-with-floor + simplified `gate·content·direction`), one epoch later.
# checkpoint-200 is the last CLEAN point before the epoch-2 entropy drift:
# trainer traces at step 200 show entropy 0.648 / IS_mean 0.984 (vs entropy 0.86 /
# IS_mean 0.969 by step ~290, where the v6 entropy<->IS coupling re-emerges,
# corr=-0.90). Evaluated to (a) confirm ckpt-200 >= ckpt-100 on the judge-free
# trio — hedge fraction was still falling at step 100, so ckpt-200 may be the
# better deliverable — and (b) bound how far to trust later checkpoints.
# Compare against the already-logged sft-contentless-v6 (== GRPO step 0) and
# v9-ckpt100 (epoch ~0.58) numbers from the identical pipelines.
# Source run: multirun/2026-06-23_grpo_redesign_full_v9/20-09-18 (job 810112).
# See wiki/grpo_training_field_notes/2026-06-23_v9_plan.md.
