# @package _global_
model:
  model_source: /share/pierson/matt/zoo/models/context-reasoner-ppo_open_thinker_acc_reward
  model_family: qwen2.5
  chat_template_kwargs:
    enable_thinking: false
  engine_kwargs:
    max_model_len: 8192
    max_num_seqs: 32
    tensor_parallel_size: 1
    trust_remote_code: true
  batch_size: 0
  concurrency: 1

# At temperature=0 this reasoning model degenerates into repetition loops —
# in the 2026-05-27 eval_all sweep, cirl_vignettes output looped on
# `<CI>...</CI><|begin_of_solution|` and never emitted an (A)/(B) verdict
# (0/669 unparseable rows contained any answer token). A nonzero temperature
# breaks the loop. Seed is fixed in the stage sampling_params for reproducibility.
sampling_params:
  temperature: 0.6
