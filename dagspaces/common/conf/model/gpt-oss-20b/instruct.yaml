# @package _global_
model:
  model_source: /share/pierson/matt/zoo/models/GPT-OSS-20B
  model_family: gpt-oss
  chat_template_kwargs: {}
  engine_kwargs:
    max_model_len: 8192
    max_num_seqs: 16
    tensor_parallel_size: 1
    trust_remote_code: true
    max_num_batched_tokens: 8192
  batch_size: 0
  concurrency: 1

# OpenAI recommends temperature=1.0 for GPT-OSS; low temps cause degenerate
# repetition loops that exhaust max_tokens before the harmony `final` channel
# (observed in the 2026-05-27 eval_all sweep: 100% finish_reason=length, all
# output stuck in the `analysis` channel). Mirrors gpt-oss-20b/sft-ci.yaml.
sampling_params:
  temperature: 1.0
