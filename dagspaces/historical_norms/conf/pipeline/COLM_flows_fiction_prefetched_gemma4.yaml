# @package _global_
# CI Information Flow Extraction — Fiction Texts (Gemma-4 gold-label regeneration).
#
# 2026-07-12 re-extraction with a fresh judge (google/gemma-4-31B-it) and
# the FICTION prompts actually applied — the first flows run after the
# prompt-wiring fix (config.yaml group defaults used to clobber pipeline
# prompt selections; every prior fiction flows run — fiction10 AND the
# 2026-07-08 top100 attempt — used the prescriptive prompt, which is why the
# top100 gate collapsed to a 0.014 flow rate under Qwen3.6; see
# notebooks/normative-simulacra/top100_flows_reasoning_sanity_2026_07.py).
# Verify the `PROMPT PROVENANCE: ci_reasoning_fiction` banner in stage logs
# and the `prompt_name` column in output parquets.
#
# Pipeline: CI Reasoning → CI Extraction (both stages — the reasoning parquet
# feeds GRPO via CI_REASONING_PATH; the flows parquet feeds SFT/embeddings).
#
# Corpus-agnostic: FICTION_CHUNKS_PATH selects fiction10 or top100 chunks
# (identical schemas). See scripts/run_extract_{fiction10,top100}_flows_gemma4.sh.
#
# Usage:
#   FICTION_CHUNKS_PATH=/path/to/chunks.parquet \
#     python -m dagspaces.historical_norms.cli \
#       pipeline=COLM_flows_fiction_prefetched_gemma4 model=gemma-4-31b/instruct

defaults:
  - override /hydra/launcher: slurm_monitor

# NOTE: this pipeline assumes `model=gemma-4-31b/instruct` is passed on the
# CLI (see comment in COLM_norms_fiction_prefetched_gemma4.yaml).

# Fiction prompt variants (live selections since the 2026-07-12 wiring fix;
# guarded by tests/historical_norms/test_prompt_wiring.py)
prompt_ci_reasoning: ${prompt_ci_reasoning_fiction}
prompt_ci_extraction: ${prompt_ci_extraction_fiction}

runtime:
  debug: false
  sample_n: null

pipeline:
  output_root: ${hydra:runtime.output_dir}/COLM_flows_fiction_gemma4
  allow_partial: false

  sources:
    prefetched_chunks:
      path: ${oc.env:FICTION_CHUNKS_PATH}
      type: parquet

  graph:
    nodes:
      # ============================================================
      # Stage 1: CI Reasoning
      # Identifies information flows in fiction and reasons about
      # context, actors, direction, and appropriateness.
      # ============================================================
      ci_reasoning:
        stage: ci_reasoning
        depends_on: []
        inputs:
          dataset: prefetched_chunks
        outputs:
          dataset: outputs/ci_reasoning/reasoning.parquet
        overrides:
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
          runtime.job_memory_gb: 256
          sampling_params.max_tokens: 4096
          # TP=2 x DP=2 (two replicas), NOT TP=4. TP=4 does fix the KV starvation
          # (2.8x -> 12.1x concurrency), but KV is not the bottleneck -- the PCIe
          # collectives are, and TP=4 doubles them (60.6ms of all-reduce per decode
          # step vs 29.4ms at TP=2). Measured on klara/A6000 at production shape,
          # per 4 GPUs: TP=2 x DP=2 = 20.3 prompts/min vs TP=4 x DP=1 = 12.3.
          # Requires NCCL_SHM_DISABLE=0. See wiki/slurm-and-env.md.
          model.engine_kwargs.data_parallel_size: 2
          model.engine_kwargs.tensor_parallel_size: 2
          model.engine_kwargs.max_num_seqs: 24
          model.engine_kwargs.gpu_memory_utilization: 0.92
          # 24576 (not the yaml's eval-tuned 16384): the ~6k-token system
          # prompt + book summary + chunk pushed 706/2993 fiction10 prompts
          # past 16384-max_tokens, silently clamping output budgets (worst
          # tail truncates mid-JSON -> parse error -> has_norms=False bias
          # against long-summary books). KV is paged, so max_model_len only
          # needs to bound the longest request.
          model.engine_kwargs.max_model_len: 24576
        launcher: slurm_gpu_4x
        wandb_suffix: ci_reasoning

      # ============================================================
      # Stage 2: CI Extraction
      # Converts reasoning traces to structured 5-component
      # CI information flow tuples.
      # ============================================================
      ci_extraction:
        stage: ci_extraction
        depends_on: [ci_reasoning]
        inputs:
          dataset: ci_reasoning.dataset
        outputs:
          dataset: outputs/ci_extraction/ci_flows.parquet
        overrides:
          runtime.debug: ${runtime.debug}
          runtime.sample_n: ${runtime.sample_n}
          runtime.job_memory_gb: 256
          sampling_params.max_tokens: 2048
          # TP=2 x DP=2 (two replicas), NOT TP=4. TP=4 does fix the KV starvation
          # (2.8x -> 12.1x concurrency), but KV is not the bottleneck -- the PCIe
          # collectives are, and TP=4 doubles them (60.6ms of all-reduce per decode
          # step vs 29.4ms at TP=2). Measured on klara/A6000 at production shape,
          # per 4 GPUs: TP=2 x DP=2 = 20.3 prompts/min vs TP=4 x DP=1 = 12.3.
          # Requires NCCL_SHM_DISABLE=0. See wiki/slurm-and-env.md.
          model.engine_kwargs.data_parallel_size: 2
          model.engine_kwargs.tensor_parallel_size: 2
          model.engine_kwargs.max_num_seqs: 24
          model.engine_kwargs.gpu_memory_utilization: 0.92
          # 24576 (not the yaml's eval-tuned 16384): the ~6k-token system
          # prompt + book summary + chunk pushed 706/2993 fiction10 prompts
          # past 16384-max_tokens, silently clamping output budgets (worst
          # tail truncates mid-JSON -> parse error -> has_norms=False bias
          # against long-summary books). KV is paged, so max_model_len only
          # needs to bound the longest request.
          model.engine_kwargs.max_model_len: 24576
        launcher: slurm_gpu_4x
        wandb_suffix: ci_extraction
