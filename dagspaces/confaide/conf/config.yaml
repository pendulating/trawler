defaults:
  - _self_
  - pipeline: confaide_eval
  - data: confaide

experiment:
  name: confaide

runtime:
  output_root: null
  debug: false
  sample_n: null
  job_memory_gb: 64

prompt:
  tier: "2a"

# Per-benchmark sanity calibration. ConfAIde tier3_control is
# single-class by design (all answers are "No"); tier2 Likert ratings
# are legitimately skewed when the model peaks on one value; tier3_free
# / 3_info / 3_sharing have privacy-preserving classes that can be
# ~0%. Without these overrides the default class_balance_min:lt=0.05
# fires on every tier and drowns real signal.
sanity:
  thresholds:
    class_balance_min:lt: 0.001

sampling_params:
  seed: 42
  temperature: 0.0
  max_tokens: 32

wandb:
  enabled: true
  project: confaide
  entity: ""
  group: ""
  table_sample_rows: 1000
  single_run: true

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
