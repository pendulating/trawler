# @package _global_
# PrivacyLens eval with a cultural name/location perturbation inserted between
# load_dataset and the inference stages. Select the culture with `perturb=<c>`
# (e.g. perturb=east_asian); perturb=western is the identity-passthrough control.
defaults:
  - /model: qwen2.5-72b/awq
  - /perturb: western
  - override /hydra/launcher: slurm_monitor

pipeline:
  output_root: ${hydra:runtime.output_dir}/privacylens_eval
  allow_partial: false
  sources: {}
  graph:
    nodes:
      load_dataset:
        stage: load_dataset
        depends_on: []
        inputs: {}
        outputs:
          dataset: outputs/load_dataset/dataset.parquet

      # Cultural perturbation: RoBERTa-large NER + deterministic name-bank swap.
      # Uses a GPU for the transformer NER (falls back to CPU if none).
      perturb_culture:
        stage: perturb_culture
        depends_on: [load_dataset]
        inputs:
          dataset: load_dataset.dataset
        outputs:
          dataset: outputs/perturb_culture/dataset.parquet
        launcher: slurm_gpu_1x

      # QA probing: 3 axes (S/V/T) per row, yes/no classification
      qa_probe_inference:
        stage: qa_probe_inference
        depends_on: [perturb_culture]
        inputs:
          dataset: perturb_culture.dataset
        outputs:
          dataset: outputs/qa_probe_inference/results.parquet
        launcher: slurm_gpu_1x

      # Agent action generation: model generates final action from trajectory
      agent_action_inference:
        stage: agent_action_inference
        depends_on: [perturb_culture]
        inputs:
          dataset: perturb_culture.dataset
        outputs:
          dataset: outputs/agent_action_inference/results.parquet
        launcher: slurm_gpu_1x

      # Leakage judgment: via external judge server (no GPU needed)
      leakage_judge_inference:
        stage: leakage_judge_inference
        depends_on: [agent_action_inference]
        inputs:
          dataset: agent_action_inference.dataset
        outputs:
          dataset: outputs/leakage_judge_inference/results.parquet

      # Helpfulness judgment: via external judge server (no GPU needed)
      helpfulness_judge_inference:
        stage: helpfulness_judge_inference
        depends_on: [agent_action_inference]
        inputs:
          dataset: agent_action_inference.dataset
        outputs:
          dataset: outputs/helpfulness_judge_inference/results.parquet

      # Compute all metrics (QA accuracy + leakage + helpfulness + adjusted leakage)
      compute_metrics:
        stage: compute_metrics
        depends_on: [qa_probe_inference, leakage_judge_inference, helpfulness_judge_inference]
        inputs:
          qa_dataset: qa_probe_inference.dataset
          leakage_dataset: leakage_judge_inference.dataset
          helpfulness_dataset: helpfulness_judge_inference.dataset
        outputs:
          dataset: outputs/compute_metrics/metrics.parquet
