# Top-level Hydra config for PrivacyLens evaluation dagspace

defaults:
  - _self_
  - pipeline: privacylens_clean
  - data: privacylens

experiment:
  name: privacylens_eval

runtime:
  output_root: null
  debug: false
  sample_n: null
  job_memory_gb: 64

# External judge server for leakage + helpfulness evaluation.
# Default: local vLLM server launched with `sbatch scripts/judge_server.sub`
# then `export JUDGE_SERVER_URL=http://klara:8002`.
# For commercial APIs, override judge.* at the CLI or in a local config:
#   judge.base_url=https://api.openai.com/v1 judge.model_name=gpt-4o judge.api_key_env=OPENAI_API_KEY
judge_server_url: ${oc.env:JUDGE_SERVER_URL,""}   # legacy alias; prefer judge.base_url below

judge:
  mode: live                       # live | async | batch_export
  # Live/async-mode config: read from $JUDGE_SERVER_URL. Async mode
  # also routes through this URL (the sidecar forwards requests.jsonl
  # to it). The previous interpolation `${judge_server_url}` only
  # worked when this top-level alias was defined and resolvable; the
  # explicit oc.env fallback below means the URL is always either a
  # real URL or empty (which fails fast in judge_export).
  base_url: ${oc.env:JUDGE_SERVER_URL,""}
  model_name: default              # vLLM: auto-detects; commercial: set explicitly
  provider: null                   # null = auto-detect | vllm | openai | anthropic | gemini | openai_compatible
  api_key: null                    # or use api_key_env
  api_key_env: null                # e.g. OPENAI_API_KEY
  max_workers: 8
  temperature: 0.0                 # shared with batch-export (body.temperature)
  max_tokens: 1024                 # shared with batch-export (body.max_tokens)
  batch:
    # Batch-export-mode config. Only consulted when mode=batch_export.
    # Async mode IGNORES this — body.model is resolved from the live
    # judge server's /v1/models via dagspaces.common.judge_export.
    # Required (no default) so a typo can't silently corrupt a billable
    # batch run; spell out the OpenAI model you want billed.
    target_model: null             # e.g. gpt-5, gpt-4o-mini
    target_endpoint: /v1/chat/completions
    output_jsonl: null             # ingest override; default picks up output.jsonl next to pending.parquet

sampling_params:
  seed: 777
  temperature: 0.2
  top_p: 1.0
  top_k: -1
  max_tokens: 2048

# Per-benchmark sanity calibration. PrivacyLens QA seeds are
# 98.6% "no" by design (every seed is a privacy violation). The
# default class_balance_min:lt=0.05 fires on every run; lower it to
# silence noise on the by-design skew while still flagging total
# degeneracy. Format-adherence (the trust gate) keeps its strict
# default of FAIL <0.9.
sanity:
  thresholds:
    class_balance_min:lt: 0.005

wandb:
  enabled: true
  project: privacylens-eval
  entity: ""
  group: ""
  table_sample_rows: 1000
  single_run: true

hydra:
  searchpath:
    - pkg://dagspaces.common.conf
  job:
    name: ${experiment.name}
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,outputs}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HYDRA_SWEEP_DIR,multirun}/${now:%Y-%m-%d}_${experiment.name}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

